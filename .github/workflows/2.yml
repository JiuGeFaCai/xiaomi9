name: OnePlus Build SuKiSu SUSFS
on:
  workflow_dispatch:
    inputs:
      CPU:
        description: "分支"
        required: true
        default: 'sm8650'
      FEIL:
        description: "配置文件"
        required: true
        default: 'oneplus_ace3_pro_v'
      CPUD:
        description: "处理器代号"
        required: true
        default: 'pineapple'
      ANDROID_VERSION:
        description: "内核安卓版本"
        required: true
        default: 'android14'
      KERNEL_VERSION:
        description: "内核版本"
        required: true
        default: '6.1'
      ksu_variant:
        description: "KernelSU 变体（ksunext=Next，ksu=官方，none=不集成）"
        type: choice
        options:
          - SukiSU
          - BakaSU
          - ksunext
          - ksu
          - none
        default: BakaSU
      sukisu_version:
        description: "KSU 分支/标签/提交（留空自动；SukiSU 用 builtin；Next 用 dev-susfs；ksu+SUSFS 可匹配兼容提交；none 忽略）"
        required: false
        default: ""
      ksu_version_override:
        description: "锁定 KSU 版本号(留空=上游默认。SukiSU 默认会联网取上游 main 提交数，与所选 commit 无关，需要对齐管理器版本时在此填数字，如 40819)"
        required: false
        default: ""
      kpm_enable:
        description: 'KPM 模式（builtin 需所选源码内置支持；kpn 为独立实现；false 关闭）'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'builtin'
          - 'kpn'
      KERNEL_NAME:
        type: string
        description: "自定义内核后缀 (留空使用随机伪官方后缀，输入-1关闭)"
        required: false
        default: ""
      BUILD_TIME:
        type: string
        description: "自定义构建时间 (输入F使用当前UTC时间，输入-1关闭)"
        required: false
        default: "Sun Jun 15 14:56:02 UTC 2025"
      ZRAM:
        type: boolean
        description: "是否启用添加更多的ZRAM算法？"
        required: true
        default: false
      enable_Unicode_bypass_Fix:
        description: "零宽字符漏洞的修复补丁"
        required: false
        default: false
        type: boolean
      sukisu_tag:
        description: "自定义版本来源后缀"
        required: false
        default: "闲鱼-搞机英雄-禁止黑灰违法犯罪倒卖"
      enable_susfs:
        description: "是否移植 SUSFS（none 模式自动跳过）"
        required: false
        default: true
        type: boolean
      sus_enable:
        type: boolean
        description: "是否切换sus提交"
        required: true
        default: false
      sus_version:
        description: "sus分支"
        required: true
        default: "123456789"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: Ensure 4 GiB swap
        shell: bash
        run: |
          set -euo pipefail
          SWAP_TARGET_MB=4096
          SWAP_CURRENT_MB=$(awk '/^SwapTotal:/ {print int($2 / 1024)}' /proc/meminfo)
          if [ "$SWAP_CURRENT_MB" -lt "$SWAP_TARGET_MB" ]; then
            SWAP_EXTRA_MB=$((SWAP_TARGET_MB - SWAP_CURRENT_MB))
            SWAP_FILE=/swapfile-kernel-build
            sudo install -m 600 /dev/null "$SWAP_FILE"
            sudo fallocate -l "${SWAP_EXTRA_MB}M" "$SWAP_FILE"
            sudo mkswap "$SWAP_FILE"
            sudo swapon "$SWAP_FILE"
          fi
          free -h
          swapon --show
          df -h / "$GITHUB_WORKSPACE"

      - name: Checkout repository
        uses: actions/checkout@v4
          
      - name: Configure Git
        run: |
         git config --global user.name "build"
         git config --global user.email "123456@qq.com"

      - name: Install dependencies
        run: |
         sudo apt update
         sudo apt install -y python3 git curl

      - name: Install repo tool
        run: |
         curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
         chmod a+x ~/repo
         sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize repo and sync
        run: |
         mkdir kernel_workspace && cd kernel_workspace
         repo init -u https://github.com/JiuGeFaCai/kernel_manifest.git -b refs/heads/oneplus/${{ github.event.inputs.CPU }} -m ${{ github.event.inputs.FEIL }}.xml --depth=1
         repo --trace sync -c -j$(nproc --all) --no-tags
         rm kernel_platform/common/android/abi_gki_protected_exports_* || echo "No protected exports!"
         rm kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || echo "No protected exports!"

      - name: Kernel Version Handling
        run: |
          cd kernel_workspace/kernel_platform
          # 获取内核 Android 版本号(KANDROID_VERSION)以及内核版本号(KERNEL_VERSION)
          for f in ./common/build.config.constants ./common/build.config.common; do
            if [ -f "$f" ]; then
              KMI=$(grep -m1 '^BRANCH=' "$f" | cut -d= -f2)
              [ -n "$KMI" ] && break
            fi
          done
          if [[ -z "$KMI" && -n "$KERNEL_REPOS" ]]; then
            KMI=$(grep -m1 '^android' "./$KERNEL_REPOS/android/ACK_SHA" | cut -d- -f1,2)
          fi
          if [ -n "$KMI" ]; then
            echo "KMI=$KMI" >> $GITHUB_ENV
            echo "KANDROID_VERSION=${KMI%-*}" >> $GITHUB_ENV
            echo "KERNEL_VERSION=${KMI#*-}" >> $GITHUB_ENV
          else
            echo "No KMI found in build.config* and ACK_SHA files"
          fi

          # 从 Makefile 获取完整内核版本号(TKERNEL_VERSION)以及可选的修改内核等级
          ORIG_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)

          # 强制修改 SUBLEVEL(内核等级)
          SUBLEVEL_INPUT="${{ github.event.inputs.SUBLEVEL }}"
          if [ -n "$SUBLEVEL_INPUT" ]; then
            echo "修改 SUBLEVEL 为 $SUBLEVEL_INPUT"
            sed -i "s/^\(SUBLEVEL[[:space:]]*=[[:space:]]*\).*/\1$SUBLEVEL_INPUT/" ./common/Makefile
          else
            echo "未指定 SUBLEVEL，保持默认"
          fi

          # 读取修改后的版本
          NEW_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)

          if [ "$ORIG_VERSION" != "$NEW_VERSION" ]; then
            echo "Kernel Version:$ORIG_VERSION->$NEW_VERSION"
            echo "TKERNEL_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          else
            echo "Kernel Version:$ORIG_VERSION No changes"
            echo "TKERNEL_VERSION=$ORIG_VERSION" >> $GITHUB_ENV
          fi

          # 内核版本的数字转换(对比用)
          echo "KV1=${KMI#*-}"       | cut -d. -f1 >> $GITHUB_ENV
          echo "KV2=${KMI#*-}"       | tr -d '.' >> $GITHUB_ENV
          echo "KV3=${NEW_VERSION}"     | tr -d '.' >> $GITHUB_ENV
          echo "KERNEL_SHORT_PATCH_VERSION=$(echo $NEW_VERSION | cut -d. -f1,2 | tr '.' '_')" >> $GITHUB_ENV



         
      - name: Set up KernelSU
        shell: bash
        env:
          KSU_REF_IN: ${{ github.event.inputs.sukisu_version }}
          KSU_VER_OVERRIDE_IN: ${{ github.event.inputs.ksu_version_override }}
          TAG_SUFFIX_IN: ${{ github.event.inputs.sukisu_tag }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          KSU_VARIANT="${{ github.event.inputs.ksu_variant }}"
          KPM_ENABLE="${{ github.event.inputs.kpm_enable }}"
          SUSFS_ENABLED="${{ github.event.inputs.enable_susfs }}"
          SUSFS_ENABLED="${SUSFS_ENABLED,,}"
          case "$KPM_ENABLE" in
            false|builtin|kpn) ;;
            *) echo "❌ 未知 KPM 模式: $KPM_ENABLE"; exit 1 ;;
          esac
          case "$SUSFS_ENABLED" in
            true|false) ;;
            *) echo "❌ 无效的 SUSFS 开关: $SUSFS_ENABLED"; exit 1 ;;
          esac

          if [ "$KSU_VARIANT" = "none" ] || [ "$KSU_VARIANT" = "无" ]; then
            if [ "$KPM_ENABLE" = "builtin" ]; then
              echo "❌ none 不能使用 builtin KPM，请选择 false 或独立的 kpn"
              exit 1
            fi
            echo "KSU_ENABLED=false" >> "$GITHUB_ENV"
            echo "KSU_SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            echo "KSU_VARIANT=none" >> "$GITHUB_ENV"
            echo "KSUVARIANT=NoKSU" >> "$GITHUB_ENV"
            KSU_VERSION=0
            echo "KSUVER=${KSU_VERSION}" >> "$GITHUB_ENV"
            echo "已选择 none，跳过 KSU 和 SUSFS；独立 KPN、ZRAM 可继续使用"
            exit 0
          fi

          KSU_REF="$(printf '%s' "${KSU_REF_IN:-}" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          if [ -z "$KSU_REF" ]; then
            if [ "$KSU_VARIANT" = "SukiSU" ]; then
              KSU_REF=builtin
            elif [ "$KSU_VARIANT" = "ksunext" ]; then
              KSU_REF=dev-susfs
            else
              KSU_REF=main
            fi
          fi
          if [[ "$KSU_REF" == -* || "$KSU_REF" =~ [[:space:]] ]]; then
            echo "❌ KSU 分支/标签/提交不能以 '-' 开头或包含空白"
            exit 1
          fi
          KSU_VER_OVERRIDE="$(printf '%s' "${KSU_VER_OVERRIDE_IN:-}" | tr -d '[:space:]')"
          case "$KSU_VER_OVERRIDE" in
            *[!0-9]*) echo "❌ ksu_version_override 必须是纯数字"; exit 1 ;;
          esac
          if [ -n "$KSU_VER_OVERRIDE" ]; then
            KSU_VER_OVERRIDE="$(printf '%s' "$KSU_VER_OVERRIDE" | sed 's/^0*//')"
            KSU_VER_OVERRIDE="${KSU_VER_OVERRIDE:-0}"
          fi

          case "$KSU_VARIANT" in
            "SukiSU")
              KSU_DIR=KernelSU
              KSU_NAME=SukiSU
              echo "添加 SukiSU..."
              curl -fLSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s -- "$KSU_REF"
              ;;
            "BakaSU")
              KSU_DIR=KernelSU
              KSU_NAME=BakaSU
              echo "添加 BakaSU..."
              curl -fLSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s -- "$KSU_REF"
              ;;
            "ksunext")
              KSU_DIR=KernelSU-Next
              KSU_NAME=KSUNext
              echo "添加 KernelSU Next..."
              curl -fLSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s -- "$KSU_REF"
              ;;
            "ksu")
              KSU_DIR=KernelSU
              KSU_NAME=KSU
              echo "添加官方 KernelSU..."
              curl -fLSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s -- "$KSU_REF"
              ;;
            *)
              echo "❌ 未知 KernelSU 变体: $KSU_VARIANT"
              exit 1
              ;;
          esac
          cd "$KSU_DIR"
          # 上游 setup.sh 可能在 checkout 失败后继续，这里核对实际提交。
          if [ "$(git rev-parse --verify --end-of-options "${KSU_REF}^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "❌ 未切换到指定的 KSU 版本: $KSU_REF"
            exit 1
          fi
          if [ "$KPM_ENABLE" = "builtin" ] && ! grep -rqE --include='Kconfig*' '^[[:space:]]*(menu)?config[[:space:]]+KPM[[:space:]]*$' kernel; then
            echo "❌ $KSU_VARIANT@$KSU_REF 没有内置 KPM，请选择 false 或独立的 kpn"
            exit 1
          fi
          if [ "$SUSFS_ENABLED" = "true" ] && [ "$KSU_VARIANT" != "ksu" ] && ! grep -rqE --include='Kconfig*' '^[[:space:]]*(menu)?config[[:space:]]+KSU_SUSFS[[:space:]]*$' kernel; then
            echo "❌ 所选 KSU 版本未提供 SUSFS 支持，请关闭 SUSFS 或选择兼容分支"
            exit 1
          fi

          case "$KSU_VARIANT" in
            "SukiSU") KSU_VERSION=$(expr "$(git rev-list --count main)" + 37185) ;;
            "BakaSU") KSU_VERSION=$(expr "$(git rev-list --count HEAD)" + 30700) ;;
            "ksunext")
              # 与 pershoot 的 Kbuild 一致，dev-susfs 按 origin/dev 的共同祖先计数。
              BASE_BRANCH=$(git rev-parse --abbrev-ref HEAD | cut -d- -f1)
              BASE_COMMIT=$(git merge-base HEAD "refs/remotes/origin/$BASE_BRANCH" 2>/dev/null || git merge-base HEAD refs/remotes/origin/main 2>/dev/null || echo HEAD)
              KSU_VERSION=$(expr "$(git rev-list --count "$BASE_COMMIT")" + 30000)
              ;;
            "ksu") KSU_VERSION=$(expr "$(git rev-list --count HEAD)" + 30000) ;;
          esac
          [ -z "$KSU_VER_OVERRIDE" ] || KSU_VERSION="$KSU_VER_OVERRIDE"
          KSU_VERSION_TO_PATCH="$KSU_VER_OVERRIDE"
          if [ "$KSU_VARIANT" = "ksunext" ] || [ "$KSU_VARIANT" = "ksu" ]; then
            KSU_VERSION_TO_PATCH="$KSU_VERSION"
          fi
          # 官方 KSU 开启 SUSFS 时，先应用补丁，再覆盖版本，避免改坏补丁上下文。
          if [ "$KSU_VARIANT" = "ksu" ] && [ "$SUSFS_ENABLED" = "true" ]; then
            KSU_VERSION_TO_PATCH=""
          fi
          if [ -n "$KSU_VERSION_TO_PATCH" ]; then
            PATCHED=0
            for VF in kernel/Kbuild kernel/Makefile; do
              [ -f "$VF" ] || continue
              # SukiSU/BakaSU 使用 :=，官方 KSU/Next 使用 $(eval KSU_VERSION=...)。
              if grep -qE '^[[:space:]]*KSU_VERSION[[:space:]]*:?=' "$VF"; then
                sed -i -E "s|^([[:space:]]*)KSU_VERSION[[:space:]]*:?=.*|\1KSU_VERSION := $KSU_VERSION_TO_PATCH|" "$VF"
                PATCHED=1
              fi
              if grep -qE '^[[:space:]]*\$\(eval[[:space:]]+KSU_VERSION[[:space:]]*=' "$VF"; then
                sed -i -E 's|^[[:space:]]*\$\(eval[[:space:]]+KSU_VERSION[[:space:]]*=.*|KSU_VERSION := '"$KSU_VERSION_TO_PATCH"'|' "$VF"
                PATCHED=1
              fi
              # 同步无法读取 .git 时的版本回退值，不改 KSU_VERSION_API/FULL。
              sed -i -E "s|^(KSU_VERSION_FALLBACK[[:space:]]*:=).*|\1 $KSU_VERSION_TO_PATCH|; s|-DKSU_VERSION=[0-9]+\b|-DKSU_VERSION=$KSU_VERSION_TO_PATCH|g" "$VF"
            done
            if [ "$PATCHED" = "0" ]; then
              echo "❌ 未找到支持的 KSU_VERSION 定义，停止构建"
              exit 1
            fi
          fi
          if [ "$KSU_VARIANT" = "ksunext" ]; then
            KSU_GIT_TAG=$(git describe --tags --abbrev=0 "$BASE_COMMIT" 2>/dev/null || true)
            if [[ "$KSU_GIT_TAG" =~ ^[a-zA-Z0-9._/+~-]+$ ]]; then
              sed -i -E "s|^KSU_VERSION_TAG_FALLBACK[[:space:]]*:=.*|KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG|" kernel/Kbuild
            fi
          fi
          echo "KSU_ENABLED=true" >> "$GITHUB_ENV"
          echo "KSU_SUSFS_ENABLED=$SUSFS_ENABLED" >> "$GITHUB_ENV"
          echo "KSU_VARIANT=$KSU_VARIANT" >> "$GITHUB_ENV"
          echo "KSUVARIANT=$KSU_NAME" >> "$GITHUB_ENV"
          echo "KSU_REF=$KSU_REF" >> "$GITHUB_ENV"
          echo "KSUVER=${KSU_VERSION}" >> "$GITHUB_ENV"
          echo "KernelSU: $KSU_NAME, version: $KSU_VERSION, ref: $KSU_REF, tag: ${TAG_SUFFIX_IN:-}"

      - name: Prepare ZRAM sources
        if: ${{ inputs.ZRAM }}
        run: |
          cd kernel_workspace
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          cd kernel_platform
          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
          echo "正在打zram补丁"
          cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux
          cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib
          cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./common/crypto
          cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/
          echo "zram_patch完成"
          fi

      - name: Set up susfs
        if: ${{ env.KSU_SUSFS_ENABLED == 'true' }}
        run: |
           cd kernel_workspace
           if [ "${{ github.event.inputs.CPU }}" = "sm8850" ]; then
            git clone -b oki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }} https://github.com/cctv18/susfs4oki.git susfs4ksu
           else
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}
           fi
           if [ "${{ github.event.inputs.sus_enable }}" = "true" ]; then
              echo "正在切换到sus提交"
              cd susfs4ksu
              git checkout ${{ github.event.inputs.sus_version }}
              cd ..
            fi

           cd kernel_platform        
           cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch ./common/
           cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
           cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/


           # Apply patches
           cd ./common

           if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            # Fake Patch to fix failures
            fake_patched=0
            fake_patched_dist=0
            fake_patched_swap=0
            fake_patched_ns=0
            fake_patched_expand=0
            if [ "$KMI" = "android15-6.6" ]; then
              if ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
                echo "未找到 nr_subpages，正在进行补丁修复"
                sed -i -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;' -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t \*res = NULL;' ./fs/proc/task_mmu.c
                fake_patched=1
              fi
              if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
                echo "未找到 #include <linux/dma-buf.h>，添加缺失的头文件"
                sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
              fi
              if ! grep -qxF '#include <linux/zswap.h>' ./mm/memory.c; then
                echo "未找到 #include <linux/zswap.h>，添加缺失的头文件"
                sed -i '/#include <linux\/sched\/sysctl\.h>/a #include <linux\/zswap.h>' ./mm/memory.c
                fake_patched_swap=1
              fi
              if ! grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c && ! grep -qxF 'susfs_def.h' ./fs/namespace.c; then
                echo "未找到 #include <trace/hooks/fs.h>，添加缺失的头文件"
                sed -i '/#include <trace\/hooks\/blk\.h>/a #include <trace\/hooks\/fs.h>' ./fs/namespace.c
                fake_patched_ns=1
              fi
              if grep -qF 'if (vma->vm_end > last_vma_end)' ./fs/proc/task_mmu.c && ! grep -qF 'if (vma->vm_end > last_vma_end) {' ./fs/proc/task_mmu.c; then
                echo "临时展开 last_vma_end if 块，修复匹配问题"
                perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\)\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);/\t\t\tif (vma->vm_end > last_vma_end) {\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t}/' ./fs/proc/task_mmu.c
                fake_patched_expand=1
              fi
            fi
            if [ "$KMI" = "android14-6.1" ]; then
              if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
                echo "未找到 vma_pages，正在进行补丁修复"
                fake_patched=1
              fi
              if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
                echo "未找到 #include <linux/dma-buf.h>，添加缺失的头文件"
                sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
              fi
            fi
            if [ "$KMI" = "android12-5.10" ] || [ "$KMI" = "android13-5.15" ]; then
              if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
                echo "未找到 vma_pages，正在进行补丁修复"
                fake_patched=1
              fi
            fi
            if [ "$KMI" = "android13-5.15" ]; then
              if grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c && ! grep -qxF '#include <linux/susfs_def.h>' ./mm/memory.c; then
                echo "发现干扰识别的 swap_slots.h，临时移除"
                sed -i '/#include <linux\/swap_slots\.h>/d' ./mm/memory.c
                fake_patched_dist=1
              fi
            fi

           patch -p1 < 50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch || true

           if grep -q 'susfs_is_current_proc_umounted\|SUSFS_IS_INODE_SUS_MAP\|SUSFS_IS_INODE_OPEN_REDIRECT' ./fs/proc/base.c && ! grep -qF '#include <linux/susfs_def.h>' ./fs/proc/base.c; then
             echo "检测到 proc/base.c 缺少 susfs_def.h，注入声明..."
             if grep -qF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
               sed -i '/#include <linux\/dma-buf.h>/a #if defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux\/susfs_def.h>\n#endif' ./fs/proc/base.c
             else
               sed -i '/#include <linux\/cpufreq_times.h>/a #if defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux\/susfs_def.h>\n#endif' ./fs/proc/base.c
             fi
           fi
           # Revert
            if [ "$fake_patched" = 1 ]; then
              if [ "$KMI" = "android15-6.6" ]; then
                if grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
                  sed -i -e '/unsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;/d' -e '/pagemap_entry_t \*res = NULL;/d' ./fs/proc/task_mmu.c
                fi
              fi
              if [ "$KMI" = "android12-5.10" ] || [ "$KMI" = "android13-5.15" ] || [ "$KMI" = "android14-6.1" ]; then
                if grep -q 'goto[[:space:]]\+show_pad;' ./fs/proc/task_mmu.c; then
                  sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
                fi
              fi
            fi
            if [ "$fake_patched_dist" = 1 ]; then
              if [ "$KMI" = "android13-5.15" ]; then
                if ! grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c; then
                  sed -i '/#ifdef CONFIG_KSU_SUSFS_SUS_MAP/i #include <linux/swap_slots.h>' ./mm/memory.c
                fi
              fi
            fi
            if [ "$fake_patched_swap" = 1 ]; then
              if [ "$KMI" = "android15-6.6" ]; then
                if grep -qxF '#include <linux/zswap.h>' ./mm/memory.c; then
                  sed -i '/#include <linux\/zswap\.h>/d' ./mm/memory.c
                fi
              fi
            fi
            if [ "$fake_patched_ns" = 1 ]; then
              if grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c && ! grep -qxF 'susfs_def.h' ./fs/namespace.c; then
                sed -i '/#include <trace\/hooks\/fs\.h>/d' ./fs/namespace.c
              fi
            fi
            if [ "$fake_patched_expand" = 1 ]; then
              if [ "$KMI" = "android15-6.6" ]; then
                if grep -qF 'if (vma->vm_end > last_vma_end) {' ./fs/proc/task_mmu.c; then
                  perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\) \{\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t\}/\t\t\tif (vma->vm_end > last_vma_end)\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);/' ./fs/proc/task_mmu.c
                fi
              fi
            fi
           fi

           # 修复 VMA_PAD_START 隐式声明（-Werror,-Wimplicit-function-declaration）
           # SUSFS 补丁引入的 task_mmu.c 代码会调用 VMA_PAD_START，但该宏定义在
           # include/linux/pgsize_migration_inline.h 中，部分内核树缺失或未被 include
           if grep -qE 'VMA_PAD_START[[:space:]]*\(' ./fs/proc/task_mmu.c; then
             PGM_INC=""
             if [ -f ./include/linux/pgsize_migration_inline.h ] && \
                grep -qE '^[[:space:]]*#[[:space:]]*define[[:space:]]+VMA_PAD_START' ./include/linux/pgsize_migration_inline.h; then
               if [ -f ./include/linux/pgsize_migration.h ]; then
                 PGM_INC="linux/pgsize_migration.h"
               else
                 PGM_INC="linux/pgsize_migration_inline.h"
               fi
             elif [ -f ./include/linux/pgsize_migration.h ] && \
                  grep -qE '^[[:space:]]*#[[:space:]]*define[[:space:]]+VMA_PAD_START' ./include/linux/pgsize_migration.h; then
               PGM_INC="linux/pgsize_migration.h"
             fi
             # 内核树自带真实定义时优先补 include
             if [ -n "$PGM_INC" ] && ! grep -qF "#include <$PGM_INC>" ./fs/proc/task_mmu.c; then
               if grep -q '^#include "internal.h"' ./fs/proc/task_mmu.c; then
                 sed -i "/^#include \"internal.h\"/i #include <$PGM_INC>" ./fs/proc/task_mmu.c
               else
                 sed -i "0,/^#include /s|^#include |#include <$PGM_INC>\n#include |" ./fs/proc/task_mmu.c
               fi
               echo "已为 task_mmu.c 补充 #include <$PGM_INC>"
             fi
             # 兜底定义，放在所有 include 之后；有真实定义时被 #ifndef 跳过
             # 4K 页配置下 vma_pad_pages() 恒为 0，与上游语义等价
             if ! grep -qE '^[[:space:]]*#[[:space:]]*define[[:space:]]+VMA_PAD_START' ./fs/proc/task_mmu.c; then
               if grep -q '^#include "internal.h"' ./fs/proc/task_mmu.c; then
                 sed -i '/^#include "internal.h"/a \\n#ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' ./fs/proc/task_mmu.c
                 echo "已为 task_mmu.c 注入 VMA_PAD_START 兜底定义"
               elif [ -z "$PGM_INC" ]; then
                 echo "警告: task_mmu.c 使用 VMA_PAD_START 但无法定位 internal.h 锚点，跳过兜底注入"
               fi
             fi
           fi

      - name: Apply official KernelSU SUSFS patch
        if: ${{ github.event.inputs.ksu_variant == 'ksu' && env.KSU_SUSFS_ENABLED == 'true' }}
        shell: bash
        env:
          KSU_REF_IN: ${{ github.event.inputs.sukisu_version }}
          KSU_VER_OVERRIDE_IN: ${{ github.event.inputs.ksu_version_override }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/KernelSU"
          KSU_PATCH="$GITHUB_WORKSPACE/kernel_workspace/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          if ! grep -rqE --include='Kconfig*' '^[[:space:]]*(menu)?config[[:space:]]+KSU_SUSFS[[:space:]]*$' kernel; then
            [ -f "$KSU_PATCH" ] || { echo "❌ 缺少官方 KSU 的 SUSFS 补丁: $KSU_PATCH"; exit 1; }
            if ! patch --dry-run --batch --forward --fuzz=0 -p1 -i "$KSU_PATCH"; then
              # 仅版本栏留空时匹配兼容提交；手填版本不自动切换。
              if [ -n "$(printf '%s' "${KSU_REF_IN:-}" | tr -d '[:space:]')" ]; then
                echo "❌ 指定的 KSU 版本与 SUSFS 补丁不匹配，请选择兼容提交或关闭 SUSFS"
                exit 1
              fi
              if [ -n "$(git status --porcelain)" ]; then
                echo "❌ KSU 源码已有修改，不能自动切换提交"
                exit 1
              fi
              KSU_CHECK_ROOT=$(mktemp -d)
              trap 'rm -rf -- "$KSU_CHECK_ROOT"' EXIT
              MATCHED=0
              # 从当前所选 SUSFS 的补丁历史发现官方 KSU 基线，再检查已知回退提交。
              KSU_CANDIDATES_FILE="$KSU_CHECK_ROOT/candidates"
              python3 "$GITHUB_WORKSPACE/.github/scripts/find_ksu_susfs_candidates.py" \
                "$GITHUB_WORKSPACE/kernel_workspace/susfs4ksu" > "$KSU_CANDIDATES_FILE"
              while IFS= read -r COMPAT_REV; do
                if ! git cat-file -e "${COMPAT_REV}^{commit}" 2>/dev/null; then
                  echo "从官方 KSU 源获取候选提交: $COMPAT_REV"
                  if ! git fetch --no-tags https://github.com/tiann/KernelSU.git "$COMPAT_REV"; then
                    echo "无法获取候选提交，继续检查: $COMPAT_REV"
                    continue
                  fi
                fi
                git cat-file -e "${COMPAT_REV}^{commit}" 2>/dev/null || continue
                echo "预检官方 KSU 候选提交: $COMPAT_REV"
                mkdir "$KSU_CHECK_ROOT/$COMPAT_REV"
                if ! git archive "$COMPAT_REV" kernel | tar -x -C "$KSU_CHECK_ROOT/$COMPAT_REV"; then
                  echo "无法读取候选提交的 kernel 源码，继续检查: $COMPAT_REV"
                  continue
                fi
                if patch --dry-run --batch --forward --fuzz=0 -p1 -d "$KSU_CHECK_ROOT/$COMPAT_REV" -i "$KSU_PATCH"; then
                  git checkout --detach "$COMPAT_REV"
                  echo "KSU_REF=$COMPAT_REV" >> "$GITHUB_ENV"
                  echo "使用已通过完整补丁预检的官方 KSU 提交: $COMPAT_REV"
                  MATCHED=1
                  break
                fi
              done < "$KSU_CANDIDATES_FILE"
              if [ "$MATCHED" = "0" ]; then
                echo "❌ 未找到与所选 SUSFS 补丁匹配的官方 KSU 提交"
                exit 1
              fi
            fi
            # 完整预检后才修改源码，禁止忽略失败继续编译。
            patch --dry-run --batch --forward --fuzz=0 -p1 -i "$KSU_PATCH"
            patch --batch --forward --fuzz=0 -p1 -i "$KSU_PATCH"
          fi
          if ! grep -rqE --include='Kconfig*' '^[[:space:]]*(menu)?config[[:space:]]+KSU_SUSFS[[:space:]]*$' kernel; then
            echo "❌ SUSFS 补丁未正确添加 KSU 配置"
            exit 1
          fi
          KSU_VER_OVERRIDE="$(printf '%s' "${KSU_VER_OVERRIDE_IN:-}" | tr -d '[:space:]')"
          case "$KSU_VER_OVERRIDE" in
            *[!0-9]*) echo "❌ ksu_version_override 必须是纯数字"; exit 1 ;;
          esac
          if [ -n "$KSU_VER_OVERRIDE" ]; then
            KSU_VER_OVERRIDE="$(printf '%s' "$KSU_VER_OVERRIDE" | sed 's/^0*//')"
            KSU_VER_OVERRIDE="${KSU_VER_OVERRIDE:-0}"
          fi
          KSU_VERSION=$(expr "$(git rev-list --count HEAD)" + 30000)
          [ -z "$KSU_VER_OVERRIDE" ] || KSU_VERSION="$KSU_VER_OVERRIDE"
          KSU_VERSION_TO_PATCH="$KSU_VERSION"
          PATCHED=0
          for VF in kernel/Kbuild kernel/Makefile; do
            [ -f "$VF" ] || continue
            # SukiSU/BakaSU 使用 :=，官方 KSU/Next 使用 $(eval KSU_VERSION=...)。
            if grep -qE '^[[:space:]]*KSU_VERSION[[:space:]]*:?=' "$VF"; then
              sed -i -E "s|^([[:space:]]*)KSU_VERSION[[:space:]]*:?=.*|\1KSU_VERSION := $KSU_VERSION_TO_PATCH|" "$VF"
              PATCHED=1
            fi
            if grep -qE '^[[:space:]]*\$\(eval[[:space:]]+KSU_VERSION[[:space:]]*=' "$VF"; then
              sed -i -E 's|^[[:space:]]*\$\(eval[[:space:]]+KSU_VERSION[[:space:]]*=.*|KSU_VERSION := '"$KSU_VERSION_TO_PATCH"'|' "$VF"
              PATCHED=1
            fi
            # 同步无法读取 .git 时的版本回退值，不改 KSU_VERSION_API/FULL。
            sed -i -E "s|^(KSU_VERSION_FALLBACK[[:space:]]*:=).*|\1 $KSU_VERSION_TO_PATCH|; s|-DKSU_VERSION=[0-9]+\b|-DKSU_VERSION=$KSU_VERSION_TO_PATCH|g" "$VF"
          done
          if [ "$PATCHED" = "0" ]; then
            echo "❌ 未找到支持的 KSU_VERSION 定义，停止构建"
            exit 1
          fi
          echo "KSUVER=${KSU_VERSION}" >> "$GITHUB_ENV"
          echo "官方 KSU + SUSFS 版本号: $KSU_VERSION"

      # - name: Fix SukiSU SUSFS compatibility
      #   if: ${{ github.event.inputs.ksu_variant == 'SukiSU' }}
      #   run: |
      #     set -euo pipefail
      #     python3 "$GITHUB_WORKSPACE/.github/scripts/fix_sukisu_susfs.py" "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"

      - name: Apply LZ4KD
        if: ${{ github.event.inputs.ZRAM == 'true' }}
        run: |
            cd kernel_workspace/kernel_platform/common
            cp ../../SukiSU_patch/other/zram/zram_patch/${{ github.event.inputs.KERNEL_VERSION }}/lz4kd.patch ./
            echo "正在打lz4kd补丁"
            patch -p1 -F 3 < lz4kd.patch || true
            echo 'lz4kd_patch完成'
            cp ../../SukiSU_patch/other/zram/zram_patch/${{ github.event.inputs.KERNEL_VERSION }}/lz4k_oplus.patch ./
            echo "正在打lz4k_oplus补丁"
            patch -p1 -F 3 < lz4k_oplus.patch || true
            echo 'lz4k_oplus_patch完成'


      
      - name: Apply Unicode bypass Fix
        if: ${{inputs.enable_Unicode_bypass_Fix }}
        run: |
         cd kernel_workspace/kernel_platform
         git clone https://$TOKEN@github.com/JiuGeFaCai/Unicode_bypass_Fix.git
         cd ./common
         if [ "$KV1" -lt 6 ]; then
            # cp ../Unicode_bypass_Fix/unicode_bypass_fix_2_6.1-.patch ./
            cp ../Unicode_bypass_Fix/unicode_bypass_fix_6.1-.patch ./
            echo "Patching unicode!"
            patch -p1 --forward < "unicode_bypass_fix_6.1-.patch" || true
          else
            cp ../Unicode_bypass_Fix/unicode_bypass_fix_6.1+.patch ./
            echo "Patching unicode!"
            patch -p1 --forward < "unicode_bypass_fix_6.1+.patch"
          fi
           
      - name: Add SUSFS Configuration Settings
        run: |
          cd kernel_workspace/kernel_platform
          CONFIG_FILE=./common/arch/arm64/configs/gki_defconfig
          # SukiSU Ultra配置
          if [ "$KSU_ENABLED" = "true" ]; then
            echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
          else
            sed -i -E '/^(CONFIG_KSU(_[A-Z0-9_]+)?=|# CONFIG_KSU(_[A-Z0-9_]+)? is not set)/d' "$CONFIG_FILE"
            echo "# CONFIG_KSU is not set" >> "$CONFIG_FILE"
          fi

          # KPM配置
          KPM_ENABLE="${{ github.event.inputs.kpm_enable }}"
          KSU_VARIANT="${{ github.event.inputs.ksu_variant }}"
          sed -i -E '/^(CONFIG_KPM=|# CONFIG_KPM is not set)/d' "$CONFIG_FILE"
          if [ "$KPM_ENABLE" = "builtin" ] && [ "$KSU_ENABLED" = "true" ]; then
            echo "CONFIG_KPM=y" >> "$CONFIG_FILE"
          else
            echo "# CONFIG_KPM is not set" >> "$CONFIG_FILE"
          fi


          # SUSFS配置
          if [ "$KSU_SUSFS_ENABLED" = "true" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CONFIG_FILE"
          else
            sed -i -E '/^(CONFIG_KSU_SUSFS(_[A-Z0-9_]+)?=|# CONFIG_KSU_SUSFS(_[A-Z0-9_]+)? is not set)/d' "$CONFIG_FILE"
            echo "# CONFIG_KSU_SUSFS is not set" >> "$CONFIG_FILE"
          fi


          # LZ4KD配置*
          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
          CONFIG_FILE=./common/arch/arm64/configs/gki_defconfig

            if [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.10" ]; then
              echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
              echo "CONFIG_ZRAM=y" >> "$CONFIG_FILE"
              echo "CONFIG_MODULE_SIG=n" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_LZO=y" >> "$CONFIG_FILE"
              echo "CONFIG_ZRAM_DEF_COMP_LZ4KD=y" >> "$CONFIG_FILE"
            fi

            if [ "${{ github.event.inputs.KERNEL_VERSION }}" != "6.6" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" != "5.10" ]; then
              if grep -q "CONFIG_ZSMALLOC" -- "$CONFIG_FILE"; then
                sed -i 's/CONFIG_ZSMALLOC=m/CONFIG_ZSMALLOC=y/g' "$CONFIG_FILE"
              else
                echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
              fi
              sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
            fi

            if [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.6" ]; then
              echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
              sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
            fi

            if [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android14" ] || [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android15" ]; then
              if [  -e ./common/modules.bzl ]; then
                sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "./common/modules.bzl"
              fi
              
              echo "CONFIG_MODULE_SIG_FORCE=n" >> "$CONFIG_FILE"
            elif [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.10" ] || [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.15" ]; then
              rm "common/android/gki_aarch64_modules"
              touch "common/android/gki_aarch64_modules"
            fi

            if grep -q "CONFIG_ZSMALLOC=y" "$CONFIG_FILE" && grep -q "CONFIG_ZRAM=y" "$CONFIG_FILE"; then
              echo "CONFIG_CRYPTO_LZ4HC=y" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_LZ4K=y" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_LZ4KD=y" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_842=y" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_LZ4K_OPLUS=y" >> "$CONFIG_FILE"
              echo "CONFIG_ZRAM_WRITEBACK=y" >> "$CONFIG_FILE"
            fi
          fi
         
          # Remove check_defconfig
          sed -i 's/check_defconfig//' ./common/build.config.gki
          cd common
          git add -A && git commit -a -m "BUILD Kernel"
          
      # 自定义内核后缀（一加结构：kernel_workspace/kernel_platform/common）
      - name: Custom Kernel Suffix if set
        if: ${{ github.event.inputs.KERNEL_NAME != '' && github.event.inputs.KERNEL_NAME != '-1' }}
        shell: bash
        env:
          SUFFIX: ${{ github.event.inputs.KERNEL_NAME }}
          ANDROID_VERSION_INPUT: ${{ github.event.inputs.ANDROID_VERSION }}
        run: |
          cd kernel_workspace/kernel_platform
          KANDROID_VERSION="${KANDROID_VERSION:-$ANDROID_VERSION_INPUT}"

          # 归一化：后缀自带前导 - 或自带 androidXX 段时视为完整 localversion，避免重复拼接
          case "$SUFFIX" in
            -*)                                        LOCALVER="$SUFFIX" ;;
            "$KANDROID_VERSION"|"$KANDROID_VERSION"-*) LOCALVER="-$SUFFIX" ;;
            *)                                         LOCALVER="-${KANDROID_VERSION}-${SUFFIX}" ;;
          esac
          # 转义 sed 替换串中的特殊字符（\ & |）
          LOCALVER_ESC=$(printf '%s' "$LOCALVER" | sed -e 's/[\\&|]/\\&/g')

          # 只改 common：GKI 目标的 KERNELRELEASE 由这一个决定，msm-kernel/external/dtc 不参与
          for f in ./common/scripts/setlocalversion; do
            [ -f "$f" ] || continue
            echo "Modifying: $f"

            # 移除 -dirty
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"

            if grep -q 'KERNELVERSION.*scm_version' "$f"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}${LOCALVER_ESC}\"|" "$f"
            elif grep -q 'echo "\$res"' "$f"; then
              echo "Detected OLD setlocalversion format"
              sed -i "s|^res=.*|res=\"${LOCALVER_ESC}\"|" "$f"
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res${LOCALVER}\"" >> "$f"
            fi
            chmod +x "$f"
          done
          echo "内核后缀: ${LOCALVER}"

      # 伪官方格式的随机后缀（仅在 KERNEL_NAME 留空时生效）
      - name: Custom Kernel Random Suffix if empty
        if: ${{ github.event.inputs.KERNEL_NAME == '' }}
        shell: bash
        env:
          ANDROID_VERSION_INPUT: ${{ github.event.inputs.ANDROID_VERSION }}
        run: |
          cd kernel_workspace/kernel_platform
          KANDROID_VERSION="${KANDROID_VERSION:-$ANDROID_VERSION_INPUT}"

          # 生成随机数字和随机 hash
          RANDOM_DIGIT=$(od -An -N1 -tu1 < /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')
          RANDOM_HASH=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \n')
          RANDOM_SUFFIX="${RANDOM_DIGIT}-o-g${RANDOM_HASH}"

          for f in ./common/scripts/setlocalversion; do
            [ -f "$f" ] || continue
            echo "Modifying: $f"

            # 移除 -dirty
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"

            if grep -q 'KERNELVERSION.*scm_version' "$f"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"|" "$f"
            elif grep -q 'echo "\$res"' "$f"; then
              echo "Detected OLD setlocalversion format"
              sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"/" "$f"
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res-${RANDOM_SUFFIX}\"" >> "$f"
            fi
            chmod +x "$f"
          done
          echo "内核后缀(随机): -${KANDROID_VERSION}-${RANDOM_SUFFIX}"


      # Custom kernel build time, without adding #1 SMP PREEMPT 自定义内核构建时间，不要加入#1 SMP PREEMPT
      - name: Custom BUILD_TIME
        if: ${{ github.event.inputs.BUILD_TIME != '-1' }}
        shell: bash
        run: |
          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" && "$INPUT_TIME" != "f" ]]; then
            DATESTR="$INPUT_TIME"
            echo "Using input BUILD_TIME: $DATESTR"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
            echo "Using UTC time as fallback: $DATESTR"
          fi
          echo "KBUILD_BUILD_TIMESTAMP=${DATESTR}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          cd kernel_workspace/kernel_platform
          for f in common/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching mkcompile_h with BUILD_TIME=$DATESTR"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          done
           
      - name: Build kernel
        run: |
         cd kernel_workspace
         if [ -e ./kernel_platform/build/build.sh ]; then
         LTO=thin ./kernel_platform/oplus/build/oplus_build_kernel.sh ${{ github.event.inputs.CPUD }} gki    
         else
         cd kernel_platform
         tools/bazel run --config=fast --config=stamp --lto=thin //common:kernel_aarch64_dist -- --dist_dir=dist
         fi

      - name: Apply KPM Patch
        run: |
         set -euo pipefail
         if [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.1" ]; then
           OUTDIR="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/dist"
         else
           OUTDIR="$GITHUB_WORKSPACE/kernel_workspace/out/dist"
         fi
         if [ ! -f "$OUTDIR/Image" ]; then
           echo "未找到 Image: $OUTDIR/Image"
           exit 1
         fi

         # 打印最终内核版本，核对后缀与构建时间是否按预期生效
         strings "$OUTDIR/Image" | grep -m1 "Linux version" || echo "未能从 Image 提取版本串"

         KPM_ENABLE="${{ github.event.inputs.kpm_enable }}"
         if [ "$KPM_ENABLE" = "builtin" ]; then
           echo "正在应用内置 KPM 并修补内核: $OUTDIR/Image"
           cd "$OUTDIR"
           curl -LO "https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/latest/download/patch_linux"
           chmod +x patch_linux
           ./patch_linux
           rm -f Image
           mv oImage Image
         elif [ "$KPM_ENABLE" = "kpn" ]; then
           echo "正在应用 KP-N 并修补内核: $OUTDIR/Image"
           cd "$OUTDIR"
           wget "https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux"
           wget "https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux"
           chmod +x ./kptools-linux
           ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage
           rm -f Image
           mv oImage Image
         else
           echo "KPM 未启用，跳过内核修补"
         fi
         
      - name: Make AnyKernel3
        run: |
         set -euo pipefail
         if [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.1" ]; then
           OUTDIR="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/dist"
         else
           OUTDIR="$GITHUB_WORKSPACE/kernel_workspace/out/dist"
         fi
         if [ ! -f "$OUTDIR/Image" ]; then
           echo "未找到 Image: $OUTDIR/Image"
           exit 1
         fi
         git clone https://github.com/JiuGeFaCai/AnyKernel3.git --depth=1
         rm -rf ./AnyKernel3/.git
         cp "$OUTDIR/Image" ./AnyKernel3/
         KPM_ENABLE="${{ github.event.inputs.kpm_enable }}"
         if [ "$KPM_ENABLE" = "kpn" ]; then
           cd ./AnyKernel3
           wget "https://github.com/cctv18/KPatch-Next/releases/latest/download/kpn.zip"
         fi
         
      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
         name: ${{ env.KSUVARIANT }}_${{ env.KSUVER }}_${{ github.event.inputs.FEIL }}_(${{ env.TKERNEL_VERSION }})
         path: ./AnyKernel3/*
         

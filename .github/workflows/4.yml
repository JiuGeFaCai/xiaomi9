name: OnePlus SM850 Build SuKiSu SUSFS
on:
  workflow_dispatch:
    inputs:
      ci_VERSION:
        description: "谷歌ci版本"
        required: true
        default: 'android16-6.12-2025-06'
      enable_oneplus_common:
        description: "是否切换一加内核源码"
        required: false
        default: false
        type: boolean
      ksu_variant:
        description: "KernelSU 变体（ksunext=Next，ksu=官方，none=不集成）"
        type: choice
        options:
          - SukiSU
          - BakaSU
          - ksunext
          - ksu
          - none
        default: BakaSU
      sukisu_version:
        description: "KSU 分支/标签/提交（留空自动；SukiSU 用 builtin；Next 用 dev-susfs；ksu+SUSFS 可匹配兼容提交；none 忽略）"
        required: false
        default: ""
      ksu_version_override:
        description: "锁定 KSU 版本号(留空=上游默认。SukiSU 默认会联网取上游 main 提交数，与所选 commit 无关，需要对齐管理器版本时在此填数字，如 40819)"
        required: false
        default: ""
      kpm_enable:
        description: 'KPM 模式（builtin 需所选源码内置支持；kpn 为独立实现；false 关闭）'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'builtin'
          - 'kpn'
      KERNEL_NAME:
        type: string
        description: "自定义内核后缀 (留空使用随机伪官方后缀，输入-1关闭)"
        required: false
        default: ""
      BUILD_TIME:
        type: string
        description: "自定义构建时间 (输入F使用当前UTC时间，输入-1关闭)"
        required: false
        default: "Sun Jun 15 14:56:02 UTC 2025"
      RE_KERNEL:
        type: boolean
        description: "是否添加Re-Kernel？"
        required: true
        default: false
      enable_oneplus_patch:
        description: "是否启用一加补丁"
        required: false
        default: true
        type: boolean
      enable_Unicode_bypass_Fix:
        description: "零宽字符漏洞的修复补丁"
        required: false
        default: false
        type: boolean
      sukisu_tag:
        description: "自定义版本来源后缀"
        required: false
        default: "酷安-ITXUU-禁止黑灰违法犯罪倒卖"
      enable_susfs:
        description: "是否移植 SUSFS（none 模式自动跳过）"
        required: false
        default: true
        type: boolean
      droidspaces_enable:
        description: '是否启用Droidspaces容器支持(轻量化的完整Linux容器支持;false关闭,standard开启容器+ntsync支持,extend开启更多测试支持项)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'standard'
          - 'extend'
      sus_enable:
        type: boolean
        description: "是否切换sus提交"
        required: true
        default: false
      sus_version:
        description: "sus分支"
        required: true
        default: "123456789"
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: Ensure 4 GiB swap
        shell: bash
        run: |
          set -euo pipefail
          SWAP_TARGET_MB=4096
          SWAP_CURRENT_MB=$(awk '/^SwapTotal:/ {print int($2 / 1024)}' /proc/meminfo)
          if [ "$SWAP_CURRENT_MB" -lt "$SWAP_TARGET_MB" ]; then
            SWAP_EXTRA_MB=$((SWAP_TARGET_MB - SWAP_CURRENT_MB))
            SWAP_FILE=/swapfile-kernel-build
            sudo install -m 600 /dev/null "$SWAP_FILE"
            sudo fallocate -l "${SWAP_EXTRA_MB}M" "$SWAP_FILE"
            sudo mkswap "$SWAP_FILE"
            sudo swapon "$SWAP_FILE"
          fi
          free -h
          swapon --show
          df -h / "$GITHUB_WORKSPACE"

      - name: Checkout repository
        uses: actions/checkout@v4
          
      - name: Configure Git
        run: |
         git config --global user.name "build"
         git config --global user.email "123456@qq.com"

      - name: Install dependencies
        run: |
         sudo apt-mark hold firefox
         sudo apt update
         sudo apt install -y curl ccache git python3 repo libelf-dev
        
      - name: Install repo tool
        run: |
         curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
         chmod a+x ~/repo
         sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize repo and sync
        run: |
         mkdir kernel_workspace && cd kernel_workspace
         FORMATTED_BRANCH="${{ github.event.inputs.ci_VERSION }}"
         repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} --repo-rev=v2.16
         REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
         DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
         if grep -q deprecated <<< $REMOTE_BRANCH; then
         echo "Found deprecated branch: ${FORMATTED_BRANCH}"
         sed -i 's/"'${FORMATTED_BRANCH}'"/"deprecated\/'${FORMATTED_BRANCH}'"/g' $DEFAULT_MANIFEST_PATH
         cat $DEFAULT_MANIFEST_PATH
         fi
         repo --version
         repo --trace sync -c -j$(nproc --all) --no-tags --fail-fast
         if [ "${{ github.event.inputs.enable_oneplus_common }}" = "true" ]; then
         if [ "${{ github.event.inputs.ci_VERSION }}" = "android16-6.12-2025-06" ]; then
         rm -rf common
         git clone https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8850.git --depth 1 common
         fi
         if [ "${{ github.event.inputs.ci_VERSION }}" = "android16-6.12-2025-09" ]; then
         rm -rf common
         git clone https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8845.git --depth 1 common
         fi
         if [ "${{ github.event.inputs.ci_VERSION }}" = "android16-6.12-2025-12" ]; then
         rm -rf common
         git clone https://github.com/OnePlusOSS/android_kernel_oneplus_mt6993.git --depth 1 common
         fi
         fi

      - name: Kernel Version Handling
        run: |
          cd kernel_workspace
          ORIG_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)
          echo "Kernel Version:$ORIG_VERSION"
          echo "TKERNEL_VERSION=$ORIG_VERSION" >> $GITHUB_ENV

         
      - name: Disable defconfig check in _setup_env.sh
        run: |
         cd kernel_workspace
         # 这段 defconfig diff 校验会因为我们在 gki_defconfig 里追加 CONFIG_* 而报错，
         # 与是否集成 KSU 无关，所以从 Set up KernelSU 里拆出来无条件执行
         sed -i '/diff -u "${source_config}" ${OUT_DIR}\/defconfig >&2 || RES=$?/,/^[[:space:]]*fi$/d' build/kernel/_setup_env.sh

      - name: Set up KernelSU
        shell: bash
        env:
          KSU_REF_IN: ${{ github.event.inputs.sukisu_version }}
          KSU_VER_OVERRIDE_IN: ${{ github.event.inputs.ksu_version_override }}
          TAG_SUFFIX_IN: ${{ github.event.inputs.sukisu_tag }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          KSU_VARIANT="${{ github.event.inputs.ksu_variant }}"
          KPM_ENABLE="${{ github.event.inputs.kpm_enable }}"
          SUSFS_ENABLED="${{ github.event.inputs.enable_susfs }}"
          SUSFS_ENABLED="${SUSFS_ENABLED,,}"
          case "$KPM_ENABLE" in
            false|builtin|kpn) ;;
            *) echo "❌ 未知 KPM 模式: $KPM_ENABLE"; exit 1 ;;
          esac
          case "$SUSFS_ENABLED" in
            true|false) ;;
            *) echo "❌ 无效的 SUSFS 开关: $SUSFS_ENABLED"; exit 1 ;;
          esac

          if [ "$KSU_VARIANT" = "none" ] || [ "$KSU_VARIANT" = "无" ]; then
            if [ "$KPM_ENABLE" = "builtin" ]; then
              echo "❌ none 不能使用 builtin KPM，请选择 false 或独立的 kpn"
              exit 1
            fi
            echo "KSU_ENABLED=false" >> "$GITHUB_ENV"
            echo "KSU_SUSFS_ENABLED=false" >> "$GITHUB_ENV"
            echo "KSU_VARIANT=none" >> "$GITHUB_ENV"
            echo "KSUVARIANT=NoKSU" >> "$GITHUB_ENV"
            KSU_VERSION=0
            echo "KSUVER=${KSU_VERSION}" >> "$GITHUB_ENV"
            echo "已选择 none，跳过 KSU 和 SUSFS；独立 KPN、ZRAM 可继续使用"
            exit 0
          fi

          KSU_REF="$(printf '%s' "${KSU_REF_IN:-}" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          if [ -z "$KSU_REF" ]; then
            if [ "$KSU_VARIANT" = "SukiSU" ]; then
              KSU_REF=builtin
            elif [ "$KSU_VARIANT" = "ksunext" ]; then
              KSU_REF=dev-susfs
            else
              KSU_REF=main
            fi
          fi
          if [[ "$KSU_REF" == -* || "$KSU_REF" =~ [[:space:]] ]]; then
            echo "❌ KSU 分支/标签/提交不能以 '-' 开头或包含空白"
            exit 1
          fi
          KSU_VER_OVERRIDE="$(printf '%s' "${KSU_VER_OVERRIDE_IN:-}" | tr -d '[:space:]')"
          case "$KSU_VER_OVERRIDE" in
            *[!0-9]*) echo "❌ ksu_version_override 必须是纯数字"; exit 1 ;;
          esac
          if [ -n "$KSU_VER_OVERRIDE" ]; then
            KSU_VER_OVERRIDE="$(printf '%s' "$KSU_VER_OVERRIDE" | sed 's/^0*//')"
            KSU_VER_OVERRIDE="${KSU_VER_OVERRIDE:-0}"
          fi

          case "$KSU_VARIANT" in
            "SukiSU")
              KSU_DIR=KernelSU
              KSU_NAME=SukiSU
              echo "添加 SukiSU..."
              curl -fLSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s -- "$KSU_REF"
              ;;
            "BakaSU")
              KSU_DIR=KernelSU
              KSU_NAME=BakaSU
              echo "添加 BakaSU..."
              curl -fLSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s -- "$KSU_REF"
              ;;
            "ksunext")
              KSU_DIR=KernelSU-Next
              KSU_NAME=KSUNext
              echo "添加 KernelSU Next..."
              curl -fLSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s -- "$KSU_REF"
              ;;
            "ksu")
              KSU_DIR=KernelSU
              KSU_NAME=KSU
              echo "添加官方 KernelSU..."
              curl -fLSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s -- "$KSU_REF"
              ;;
            *)
              echo "❌ 未知 KernelSU 变体: $KSU_VARIANT"
              exit 1
              ;;
          esac
          cd "$KSU_DIR"
          # 上游 setup.sh 可能在 checkout 失败后继续，这里核对实际提交。
          if [ "$(git rev-parse --verify --end-of-options "${KSU_REF}^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "❌ 未切换到指定的 KSU 版本: $KSU_REF"
            exit 1
          fi
          if [ "$KPM_ENABLE" = "builtin" ] && ! grep -rqE --include='Kconfig*' '^[[:space:]]*(menu)?config[[:space:]]+KPM[[:space:]]*$' kernel; then
            echo "❌ $KSU_VARIANT@$KSU_REF 没有内置 KPM，请选择 false 或独立的 kpn"
            exit 1
          fi
          if [ "$SUSFS_ENABLED" = "true" ] && [ "$KSU_VARIANT" != "ksu" ] && ! grep -rqE --include='Kconfig*' '^[[:space:]]*(menu)?config[[:space:]]+KSU_SUSFS[[:space:]]*$' kernel; then
            echo "❌ 所选 KSU 版本未提供 SUSFS 支持，请关闭 SUSFS 或选择兼容分支"
            exit 1
          fi

          case "$KSU_VARIANT" in
            "SukiSU") KSU_VERSION=$(expr "$(git rev-list --count main)" + 37185) ;;
            "BakaSU") KSU_VERSION=$(expr "$(git rev-list --count HEAD)" + 30700) ;;
            "ksunext")
              # 与 pershoot 的 Kbuild 一致，dev-susfs 按 origin/dev 的共同祖先计数。
              BASE_BRANCH=$(git rev-parse --abbrev-ref HEAD | cut -d- -f1)
              BASE_COMMIT=$(git merge-base HEAD "refs/remotes/origin/$BASE_BRANCH" 2>/dev/null || git merge-base HEAD refs/remotes/origin/main 2>/dev/null || echo HEAD)
              KSU_VERSION=$(expr "$(git rev-list --count "$BASE_COMMIT")" + 30000)
              ;;
            "ksu") KSU_VERSION=$(expr "$(git rev-list --count HEAD)" + 30000) ;;
          esac
          [ -z "$KSU_VER_OVERRIDE" ] || KSU_VERSION="$KSU_VER_OVERRIDE"
          KSU_VERSION_TO_PATCH="$KSU_VER_OVERRIDE"
          if [ "$KSU_VARIANT" = "ksunext" ] || [ "$KSU_VARIANT" = "ksu" ]; then
            KSU_VERSION_TO_PATCH="$KSU_VERSION"
          fi
          # 官方 KSU 开启 SUSFS 时，先应用补丁，再覆盖版本，避免改坏补丁上下文。
          if [ "$KSU_VARIANT" = "ksu" ] && [ "$SUSFS_ENABLED" = "true" ]; then
            KSU_VERSION_TO_PATCH=""
          fi
          if [ -n "$KSU_VERSION_TO_PATCH" ]; then
            PATCHED=0
            for VF in kernel/Kbuild kernel/Makefile; do
              [ -f "$VF" ] || continue
              # SukiSU/BakaSU 使用 :=，官方 KSU/Next 使用 $(eval KSU_VERSION=...)。
              if grep -qE '^[[:space:]]*KSU_VERSION[[:space:]]*:?=' "$VF"; then
                sed -i -E "s|^([[:space:]]*)KSU_VERSION[[:space:]]*:?=.*|\1KSU_VERSION := $KSU_VERSION_TO_PATCH|" "$VF"
                PATCHED=1
              fi
              if grep -qE '^[[:space:]]*\$\(eval[[:space:]]+KSU_VERSION[[:space:]]*=' "$VF"; then
                sed -i -E 's|^[[:space:]]*\$\(eval[[:space:]]+KSU_VERSION[[:space:]]*=.*|KSU_VERSION := '"$KSU_VERSION_TO_PATCH"'|' "$VF"
                PATCHED=1
              fi
              # 同步无法读取 .git 时的版本回退值，不改 KSU_VERSION_API/FULL。
              sed -i -E "s|^(KSU_VERSION_FALLBACK[[:space:]]*:=).*|\1 $KSU_VERSION_TO_PATCH|; s|-DKSU_VERSION=[0-9]+\b|-DKSU_VERSION=$KSU_VERSION_TO_PATCH|g" "$VF"
            done
            if [ "$PATCHED" = "0" ]; then
              echo "❌ 未找到支持的 KSU_VERSION 定义，停止构建"
              exit 1
            fi
          fi
          if [ "$KSU_VARIANT" = "ksunext" ]; then
            KSU_GIT_TAG=$(git describe --tags --abbrev=0 "$BASE_COMMIT" 2>/dev/null || true)
            if [[ "$KSU_GIT_TAG" =~ ^[a-zA-Z0-9._/+~-]+$ ]]; then
              sed -i -E "s|^KSU_VERSION_TAG_FALLBACK[[:space:]]*:=.*|KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG|" kernel/Kbuild
            fi
          fi
          echo "KSU_ENABLED=true" >> "$GITHUB_ENV"
          echo "KSU_SUSFS_ENABLED=$SUSFS_ENABLED" >> "$GITHUB_ENV"
          echo "KSU_VARIANT=$KSU_VARIANT" >> "$GITHUB_ENV"
          echo "KSUVARIANT=$KSU_NAME" >> "$GITHUB_ENV"
          echo "KSU_REF=$KSU_REF" >> "$GITHUB_ENV"
          echo "KSUVER=${KSU_VERSION}" >> "$GITHUB_ENV"
          echo "KernelSU: $KSU_NAME, version: $KSU_VERSION, ref: $KSU_REF, tag: ${TAG_SUFFIX_IN:-}"

      - name: Fix SukiSU/BakaSU 6.12 compatibility
        if: ${{ startsWith(github.event.inputs.ci_VERSION, 'android16-6.12') && (github.event.inputs.ksu_variant == 'SukiSU' || github.event.inputs.ksu_variant == 'BakaSU') }}
        run: |
         cd kernel_workspace
         python3 - <<'PY'
         from pathlib import Path

         changed = False
         ksu_dirs = [
             Path("common/drivers/kernelsu"),
             Path("drivers/kernelsu"),
             Path("KernelSU/kernel"),
         ]

         netlink_h = Path("common/include/linux/netlink.h")
         netlink_text = netlink_h.read_text(errors="ignore") if netlink_h.exists() else ""
         if netlink_h.exists() and "cb_mutex" not in netlink_text:
             for ksu_dir in ksu_dirs:
                 super_access_c = ksu_dir / "kpm/super_access.c"
                 if not super_access_c.exists():
                     continue
                 text = super_access_c.read_text()
                 line = "DEFINE_MEMBER(netlink_kernel_cfg, cb_mutex)\n"
                 if line in text:
                     super_access_c.write_text(text.replace(line, "", 1))
                     changed = True
                     print(f"Removed missing netlink_kernel_cfg.cb_mutex probe: {super_access_c}")

         lsm_hooks_h = Path("common/include/linux/lsm_hooks.h")
         lsm_hooks_text = lsm_hooks_h.read_text(errors="ignore") if lsm_hooks_h.exists() else ""
         if "const struct lsm_id *lsmid" in lsm_hooks_text:
             for ksu_dir in ksu_dirs:
                 lsm_hook_c = ksu_dir / "hook/lsm_hook.c"
                 if not lsm_hook_c.exists():
                     continue
                 text = lsm_hook_c.read_text()
                 old_call = '    security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksu");'
                 if old_call not in text or "ksu_lsmid" in text:
                     continue
                 anchor = "\nvoid __init ksu_lsm_hook_init(void)\n"
                 old_block = (
                     "#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 11, 0)\n"
                     f"{old_call}\n"
                     "#else"
                 )
                 new_block = (
                     "#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 12, 0)\n"
                     "    security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), &ksu_lsmid);\n"
                     "#elif LINUX_VERSION_CODE >= KERNEL_VERSION(4, 11, 0)\n"
                     f"{old_call}\n"
                     "#else"
                 )
                 lsmid_block = "\n".join([
                     "",
                     "/* Android 16 / 6.12 security_add_hooks() expects struct lsm_id. */",
                     "#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 12, 0)",
                     "static const struct lsm_id ksu_lsmid = {",
                     '    .name = "ksu",',
                     "    .id = 0,",
                     "};",
                     "#endif",
                     "",
                 ])
                 if anchor not in text or old_block not in text:
                     continue
                 text = text.replace(anchor, lsmid_block + anchor, 1)
                 text = text.replace(old_block, new_block, 1)
                 lsm_hook_c.write_text(text)
                 changed = True
                 print(f"Adapted security_add_hooks lsm_id argument: {lsm_hook_c}")

         if not changed:
             print("SukiSU/BakaSU 6.12 compatibility fix did not need changes.")
         PY
         
      - name: Set up susfs
        if: ${{ env.KSU_SUSFS_ENABLED == 'true' }}
        run: |
           cd kernel_workspace
           git clone -b oki-android16-6.12 https://github.com/cctv18/susfs4oki.git susfs4ksu

           if [ "${{ github.event.inputs.sus_enable }}" = "true" ]; then
              echo "正在切换到sus提交"
              cd susfs4ksu
              git checkout ${{ github.event.inputs.sus_version }}
              cd ..
            fi

           git clone https://github.com/ShirkNeko/SukiSU_patch.git
           cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch ./common/
           cp susfs4ksu/kernel_patches/fs/* ./common/fs/
           cp susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/

           # Apply patches
           cd ./common
           patch -p1 < 50_add_susfs_in_gki-android16-6.12.patch || true

           # patch 后面挂了 || true，被拒的 hunk 不会让这一步失败，
           # 只会在后面编译时才炸（比如 exec.c 少了 susfs_def.h），所以先把 .rej 打出来
           if find . -name '*.rej' | grep -q .; then
             echo "::warning::以下 hunk 被拒绝，需人工确认："
             find . -name '*.rej' -print -exec cat {} \;
           fi

      - name: Apply official KernelSU SUSFS patch
        if: ${{ github.event.inputs.ksu_variant == 'ksu' && env.KSU_SUSFS_ENABLED == 'true' }}
        shell: bash
        env:
          KSU_REF_IN: ${{ github.event.inputs.sukisu_version }}
          KSU_VER_OVERRIDE_IN: ${{ github.event.inputs.ksu_version_override }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/KernelSU"
          KSU_PATCH="$GITHUB_WORKSPACE/kernel_workspace/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          if ! grep -rqE --include='Kconfig*' '^[[:space:]]*(menu)?config[[:space:]]+KSU_SUSFS[[:space:]]*$' kernel; then
            [ -f "$KSU_PATCH" ] || { echo "❌ 缺少官方 KSU 的 SUSFS 补丁: $KSU_PATCH"; exit 1; }
            if ! patch --dry-run --batch --forward --fuzz=0 -p1 -i "$KSU_PATCH"; then
              # 仅版本栏留空时匹配兼容提交；手填版本不自动切换。
              if [ -n "$(printf '%s' "${KSU_REF_IN:-}" | tr -d '[:space:]')" ]; then
                echo "❌ 指定的 KSU 版本与 SUSFS 补丁不匹配，请选择兼容提交或关闭 SUSFS"
                exit 1
              fi
              if [ -n "$(git status --porcelain)" ]; then
                echo "❌ KSU 源码已有修改，不能自动切换提交"
                exit 1
              fi
              KSU_CHECK_ROOT=$(mktemp -d)
              trap 'rm -rf -- "$KSU_CHECK_ROOT"' EXIT
              MATCHED=0
              # 从当前所选 SUSFS 的补丁历史发现官方 KSU 基线，再检查已知回退提交。
              KSU_CANDIDATES_FILE="$KSU_CHECK_ROOT/candidates"
              python3 "$GITHUB_WORKSPACE/.github/scripts/find_ksu_susfs_candidates.py" \
                "$GITHUB_WORKSPACE/kernel_workspace/susfs4ksu" > "$KSU_CANDIDATES_FILE"
              while IFS= read -r COMPAT_REV; do
                if ! git cat-file -e "${COMPAT_REV}^{commit}" 2>/dev/null; then
                  echo "从官方 KSU 源获取候选提交: $COMPAT_REV"
                  if ! git fetch --no-tags https://github.com/tiann/KernelSU.git "$COMPAT_REV"; then
                    echo "无法获取候选提交，继续检查: $COMPAT_REV"
                    continue
                  fi
                fi
                git cat-file -e "${COMPAT_REV}^{commit}" 2>/dev/null || continue
                echo "预检官方 KSU 候选提交: $COMPAT_REV"
                mkdir "$KSU_CHECK_ROOT/$COMPAT_REV"
                if ! git archive "$COMPAT_REV" kernel | tar -x -C "$KSU_CHECK_ROOT/$COMPAT_REV"; then
                  echo "无法读取候选提交的 kernel 源码，继续检查: $COMPAT_REV"
                  continue
                fi
                if patch --dry-run --batch --forward --fuzz=0 -p1 -d "$KSU_CHECK_ROOT/$COMPAT_REV" -i "$KSU_PATCH"; then
                  git checkout --detach "$COMPAT_REV"
                  echo "KSU_REF=$COMPAT_REV" >> "$GITHUB_ENV"
                  echo "使用已通过完整补丁预检的官方 KSU 提交: $COMPAT_REV"
                  MATCHED=1
                  break
                fi
              done < "$KSU_CANDIDATES_FILE"
              if [ "$MATCHED" = "0" ]; then
                echo "❌ 未找到与所选 SUSFS 补丁匹配的官方 KSU 提交"
                exit 1
              fi
            fi
            # 完整预检后才修改源码，禁止忽略失败继续编译。
            patch --dry-run --batch --forward --fuzz=0 -p1 -i "$KSU_PATCH"
            patch --batch --forward --fuzz=0 -p1 -i "$KSU_PATCH"
          fi
          if ! grep -rqE --include='Kconfig*' '^[[:space:]]*(menu)?config[[:space:]]+KSU_SUSFS[[:space:]]*$' kernel; then
            echo "❌ SUSFS 补丁未正确添加 KSU 配置"
            exit 1
          fi
          KSU_VER_OVERRIDE="$(printf '%s' "${KSU_VER_OVERRIDE_IN:-}" | tr -d '[:space:]')"
          case "$KSU_VER_OVERRIDE" in
            *[!0-9]*) echo "❌ ksu_version_override 必须是纯数字"; exit 1 ;;
          esac
          if [ -n "$KSU_VER_OVERRIDE" ]; then
            KSU_VER_OVERRIDE="$(printf '%s' "$KSU_VER_OVERRIDE" | sed 's/^0*//')"
            KSU_VER_OVERRIDE="${KSU_VER_OVERRIDE:-0}"
          fi
          KSU_VERSION=$(expr "$(git rev-list --count HEAD)" + 30000)
          [ -z "$KSU_VER_OVERRIDE" ] || KSU_VERSION="$KSU_VER_OVERRIDE"
          KSU_VERSION_TO_PATCH="$KSU_VERSION"
          PATCHED=0
          for VF in kernel/Kbuild kernel/Makefile; do
            [ -f "$VF" ] || continue
            # SukiSU/BakaSU 使用 :=，官方 KSU/Next 使用 $(eval KSU_VERSION=...)。
            if grep -qE '^[[:space:]]*KSU_VERSION[[:space:]]*:?=' "$VF"; then
              sed -i -E "s|^([[:space:]]*)KSU_VERSION[[:space:]]*:?=.*|\1KSU_VERSION := $KSU_VERSION_TO_PATCH|" "$VF"
              PATCHED=1
            fi
            if grep -qE '^[[:space:]]*\$\(eval[[:space:]]+KSU_VERSION[[:space:]]*=' "$VF"; then
              sed -i -E 's|^[[:space:]]*\$\(eval[[:space:]]+KSU_VERSION[[:space:]]*=.*|KSU_VERSION := '"$KSU_VERSION_TO_PATCH"'|' "$VF"
              PATCHED=1
            fi
            # 同步无法读取 .git 时的版本回退值，不改 KSU_VERSION_API/FULL。
            sed -i -E "s|^(KSU_VERSION_FALLBACK[[:space:]]*:=).*|\1 $KSU_VERSION_TO_PATCH|; s|-DKSU_VERSION=[0-9]+\b|-DKSU_VERSION=$KSU_VERSION_TO_PATCH|g" "$VF"
          done
          if [ "$PATCHED" = "0" ]; then
            echo "❌ 未找到支持的 KSU_VERSION 定义，停止构建"
            exit 1
          fi
          echo "KSUVER=${KSU_VERSION}" >> "$GITHUB_ENV"
          echo "官方 KSU + SUSFS 版本号: $KSU_VERSION"

      - name: Fix SUSFS exec.c header
        if: ${{ env.KSU_SUSFS_ENABLED == 'true' }}
        run: |
          cd kernel_workspace/common
          # exec.c 用到的 susfs 符号会随版本变（旧版 *_umounted，新版 *_no_su），
          # 所以按前缀统一判断，别写死单个函数名
          if grep -qE 'susfs_(is|set|clear)_current_proc' ./fs/exec.c && ! grep -qF '#include <linux/susfs_def.h>' ./fs/exec.c; then
            # uaccess.h 是 exec.c 里从 5.10 到 6.12 都稳定存在的锚点，
            # dma-buf.h / ksm.h 不一定有，sed 找不到锚点会静默什么都不做
            awk '/^#include <linux\/uaccess\.h>/ && !d { print "#ifdef CONFIG_KSU_SUSFS"; print "#include <linux/susfs_def.h>"; print "#endif"; d=1 } { print }' ./fs/exec.c > /tmp/exec.c
            mv /tmp/exec.c ./fs/exec.c
            grep -qF '#include <linux/susfs_def.h>' ./fs/exec.c || { echo "❌ exec.c 插入 susfs_def.h 失败，锚点已变"; exit 1; }
            echo "✅ 已修复 exec.c 缺少 susfs_def.h 问题"
          else
            echo "exec.c 无需修复或已包含 susfs_def.h"
          fi

      - name: Guard unsupported SUSFS priority UID calls
        if: ${{ github.event.inputs.ksu_variant == 'SukiSU' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/fix_susfs_priority_uid.py" "$GITHUB_WORKSPACE/kernel_workspace/common"
      
      # - name: Apply HOOK
      #   run: |
      #     cd kernel_workspace/common
      #     if [ "${{ github.event.inputs.HOOK }}" = "kprobe" ]; then
      #     echo "调用 kprobe 钩子"
      #     elif [ "${{ github.event.inputs.HOOK }}" = "manual" ]; then
      #     cp ../SukiSU_patch/hooks/scope_min_manual_hooks_v1.6.patch ./
      #     echo "调用 manual 钩子"
      #     patch -p1 -F 3 < scope_min_manual_hooks_v1.6.patch
      #     elif [ "${{ github.event.inputs.HOOK }}" = "tracepoint" ]; then
      #     cp ../SukiSU_patch/hooks/sukisu_tracepoint_hooks_v1.1.patch ./
      #     echo "调用 tracepoint 钩子"
      #     patch -p1 -F 3 < sukisu_tracepoint_hooks_v1.1.patch
      #     fi
      
      # Custom kernel build time, without adding #1 SMP PREEMPT 自定义内核构建时间，不要加入#1 SMP PREEMPT
      - name: Custom BUILD_TIME
        if: ${{ github.event.inputs.BUILD_TIME != '-1' }}
        shell: bash
        run: |
          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" && "$INPUT_TIME" != "f" ]]; then
            DATESTR="$INPUT_TIME"
            echo "Using input BUILD_TIME: $DATESTR"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
            echo "Using UTC time as fallback: $DATESTR"
          fi
          echo "KBUILD_BUILD_TIMESTAMP=${DATESTR}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          cd kernel_workspace/
          for f in common/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching mkcompile_h with BUILD_TIME=$DATESTR"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          done
          
      - name: oneplus
        if: ${{ inputs.enable_oneplus_patch }}
        run: |
         cd kernel_workspace
         git clone https://github.com/JiuGeFaCai/sturdy-journey.git
         cp ./sturdy-journey/lsm.patch ./common/
         cd ./common
         patch -p1 -F 3 < lsm.patch

      # - name: sb
      #   if: ${{ inputs.enable_device_check }}
      #   run: |
      #    cd kernel_workspace/common/drivers
      #    git clone https://$TOKEN@github.com/JiuGeFaCai/device_check.git --depth 1
      #    TAG_DEVICE="${{ github.event.inputs.device_tag }}"
      #    sed -i "s/a2cbba3e/$TAG_DEVICE/g" device_check/serial_check.c
      #    echo "obj-y				+= device_check/" >> Makefile


      - name: Apply Unicode bypass Fix
        if: ${{inputs.enable_Unicode_bypass_Fix }}
        run: |
         cd kernel_workspace
         git clone https://$TOKEN@github.com/JiuGeFaCai/Unicode_bypass_Fix.git
         cp ./Unicode_bypass_Fix/unicode_bypass_fix_6.1+.patch ./common/
         cd ./common
         patch -p1 -F 3 < unicode_bypass_fix_6.1+.patch

      - name: Apply RE_KERNEL
        if: ${{ github.event.inputs.RE_KERNEL == 'true' }}
        run: |
          cd kernel_workspace
          # clone 放在这里而不是 Set up susfs 里：Re-Kernel 与 SUSFS 互不依赖，
          # 之前 clone 挂在 Set up susfs 内，enable_susfs=false 时整步被跳过，
          # 这里就找不到 Re-Kernel/LKM-Source 而 cp 失败
          if [ ! -d Re-Kernel ]; then
            git clone --depth 1 https://github.com/Sakion-Team/Re-Kernel.git
          fi
          RE_DIR="$(pwd)/Re-Kernel/LKM-Source"
          if [ ! -f "$RE_DIR/rekernel.h" ]; then
            echo "❌ 未找到 $RE_DIR/rekernel.h，Re-Kernel 上游结构可能已变更"
            exit 1
          fi

          cd common
          sed -i '/endmenu/i source "drivers/rekernel/Kconfig"' drivers/Kconfig
          sed -i '$a \#Re-Kernel Support\nobj-$(CONFIG_REKERNEL) += rekernel/' drivers/Makefile
          mkdir -p drivers/rekernel
          # 上游 2026-06-28 把 rekernel 拆成了多个编译单元(rekernel_main/netlink/binder/... )，
          # 不再有单体 rekernel.c，所以这里整体拷贝，别写死文件名
          cp "$RE_DIR"/*.c "$RE_DIR"/*.h "$RE_DIR"/Makefile "$RE_DIR"/Kconfig drivers/rekernel/
          ls -la drivers/rekernel/

      - name: 启用 Droidspaces 容器支持
        if: ${{ inputs.droidspaces_enable != 'false' }}
        env:
          CI_VERSION: ${{ github.event.inputs.ci_VERSION }}
          DROIDSPACES_MODE: ${{ github.event.inputs.droidspaces_enable }}
        run: |
          echo "正在启用 Droidspaces 容器支持 (模式: $DROIDSPACES_MODE)..."
          # 补丁随本仓库分发，checkout 后就在 $GITHUB_WORKSPACE/droidspaces_patch 下，无需联网拉取
          DS_PATCH_DIR="$GITHUB_WORKSPACE/droidspaces_patch"
          if [ ! -d "$DS_PATCH_DIR" ]; then
            echo "❌ 未找到 $DS_PATCH_DIR，droidspaces 补丁目录缺失"
            exit 1
          fi

          # ANDROID_VERSION / KERNEL_VERSION 从 ci_VERSION (如 android16-6.12-2025-06) 首两段拆出，
          # 用于拼 ntsync 补丁名，保持与文件名 ntsync_compat_android16-6.12.patch 一致
          ANDROID_VERSION="$(echo "$CI_VERSION" | cut -d- -f1)"
          KERNEL_VERSION="$(echo "$CI_VERSION" | cut -d- -f2)"
          NTSYNC_PATCH="ntsync_compat_${ANDROID_VERSION}-${KERNEL_VERSION}.patch"

          cd kernel_workspace/common

          apply_patch() {
            local pf="$1"
            if [ ! -f "$DS_PATCH_DIR/$pf" ]; then
              echo "::warning::补丁不存在，跳过: $pf"
              return 1
            fi
            cp "$DS_PATCH_DIR/$pf" ./
            echo "应用补丁: $pf"
            # patch 挂了也别让这一步失败（后面编译时才炸更难看），只记录下来；
            # 比较前后的 .rej 差集才能定位是哪个补丁落空的 hunk
            local before after rc=0
            before="$(find . -name '*.rej' | sort)"
            patch -p1 -F 3 < "$pf" || rc=1
            after="$(find . -name '*.rej' | sort)"
            if [ "$before" != "$after" ]; then
              echo "::warning::$pf 有 hunk 被拒绝："
              comm -13 <(echo "$before") <(echo "$after")
            fi
            return $rc
          }

          # 应用 Droidspaces 容器必须补丁
          # 导出 init_ipc_ns/put_ipc_ns：gki_defconfig 的 ANDROID_BINDER_IPC_RUST=m 会编出
          # rust_binder.ko，而 rust_binderfs.c 在 CONFIG_IPC_NS 下引用这两个符号，
          # 上游 ipc/ 通篇没有 EXPORT_SYMBOL，modpost 阶段必然报 undefined
          apply_patch export_ipc_ns.patch || true
          apply_patch fix_sysvipc_kabi_a16-6.12.patch || true
          # 修补 oplus_bsp_midas 行为，避免开机崩溃（未切换一加源码时 hunk 落空属正常）
          apply_patch fix_oplus_bsp_midas.patch || true
          # 修补 oplus_bsp_sched_assist 数组越界访问导致的运行时随机崩溃
          apply_patch ddl_hit_hook.patch || true

          # 开启 Droidspaces 容器所需内核支持
          CONFIG_FILE=./arch/arm64/configs/gki_defconfig
          echo "CONFIG_PID_NS=y" >> "$CONFIG_FILE"
          echo "CONFIG_IPC_NS=y" >> "$CONFIG_FILE"
          echo "CONFIG_USER_NS=y" >> "$CONFIG_FILE"
          echo "CONFIG_SYSVIPC=y" >> "$CONFIG_FILE"
          echo "CONFIG_DEVTMPFS=y" >> "$CONFIG_FILE"
          echo "CONFIG_NAMESPACES=y" >> "$CONFIG_FILE"
          echo "CONFIG_POSIX_MQUEUE=y" >> "$CONFIG_FILE"
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> "$CONFIG_FILE"
          echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> "$CONFIG_FILE"
          echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> "$CONFIG_FILE"
          echo "CONFIG_NETFILTER_XT_TARGET_REJECT=y" >> "$CONFIG_FILE"
          echo "CONFIG_IP_SET=y" >> "$CONFIG_FILE"
          echo "CONFIG_TMPFS_XATTR=y" >> "$CONFIG_FILE"
          # 未经测试的配置选项，可能导致bug
          # echo "CONFIG_CGROUP_DEVICE=y" >> "$CONFIG_FILE"
          # echo "CONFIG_CGROUP_PIDS=y" >> "$CONFIG_FILE"
          # echo "CONFIG_FW_LOADER_COMPRESS=y" >> "$CONFIG_FILE"
          # echo "CONFIG_BRIDGE_NETFILTER=y" >> "$CONFIG_FILE"
          # echo "CONFIG_NF_TABLES=y" >> "$CONFIG_FILE"

          # 开启 NTSync：6.12 上该选项原为 "depends on BROKEN"，靠 ntsync 补丁改成可选，
          # 补丁没打上时写 CONFIG_NTSYNC=y 会被 kconfig 判为 unmet dependency 而丢弃
          if apply_patch "$NTSYNC_PATCH"; then
            echo "CONFIG_NTSYNC=y" >> "$CONFIG_FILE"
          else
            echo "::warning::$NTSYNC_PATCH 未成功应用，跳过 CONFIG_NTSYNC"
          fi

          if [ "$DROIDSPACES_MODE" = "extend" ]; then
            echo "正在启用容器环境扩展支持..."
            # 开启虚拟 HCI 设备支持
            echo "CONFIG_BT_HCIVHCI=y" >> "$CONFIG_FILE"
            # 开启 systemd-coredump 支持
            echo "CONFIG_STATIC_USERMODEHELPER=n" >> "$CONFIG_FILE"
            # 添加 Lindroid EVDI DRM 驱动（上游亦保持注释：未经测试，可能导致 bug）
            # cp "$DS_PATCH_DIR/evdi_drm.patch" ./
            # patch -p1 -F 3 < evdi_drm.patch || true
            # echo "CONFIG_DRM_LINDROID_EVDI=y" >> "$CONFIG_FILE"
          fi
          echo "✅ Droidspaces 容器支持配置完成"


      - name: Add SUSFS Configuration Settings
        run: |
          cd kernel_workspace
          CONFIG_FILE=./common/arch/arm64/configs/gki_defconfig
          KPM_ENABLE="${{ github.event.inputs.kpm_enable }}"
          KSU_VARIANT="${{ github.event.inputs.ksu_variant }}"

          # KSU 本体配置
          if [ "$KSU_ENABLED" = "true" ]; then
            echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
          else
            sed -i -E '/^(CONFIG_KSU(_[A-Z0-9_]+)?=|# CONFIG_KSU(_[A-Z0-9_]+)? is not set)/d' "$CONFIG_FILE"
            echo "# CONFIG_KSU is not set" >> "$CONFIG_FILE"
          fi

          # KPM配置
          sed -i -E '/^(CONFIG_KPM=|# CONFIG_KPM is not set)/d' "$CONFIG_FILE"
          if [ "$KPM_ENABLE" = "builtin" ] && [ "$KSU_ENABLED" = "true" ]; then
            echo "CONFIG_KPM=y" >> "$CONFIG_FILE"
          else
            echo "# CONFIG_KPM is not set" >> "$CONFIG_FILE"
          fi


          # SUSFS配置
          if [ "$KSU_SUSFS_ENABLED" = "true" ]; then
          echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CONFIG_FILE"
          else
          sed -i -E '/^(CONFIG_KSU_SUSFS(_[A-Z0-9_]+)?=|# CONFIG_KSU_SUSFS(_[A-Z0-9_]+)? is not set)/d' "$CONFIG_FILE"
          echo "# CONFIG_KSU_SUSFS is not set" >> "$CONFIG_FILE"
          echo "已关闭 SUSFS 移植，跳过 SUSFS 内核配置"
          fi

          # Re-Kernel配置*
          if [ "${{ github.event.inputs.RE_KERNEL }}" = "true" ]; then
            echo "CONFIG_REKERNEL=y" >> "$CONFIG_FILE"
            echo "CONFIG_REKERNEL_NETWORK=y" >> "$CONFIG_FILE"
          fi
          
          # Remove check_defconfig
          sed -i 's/check_defconfig//' ./common/build.config.gki
          cd common
          if [ -f "BUILD.bazel" ]; then
          sed -i '/protected_module_names_list.*gki_aarch64_protected_module_names/d' BUILD.bazel
          fi

      # 自定义内核后缀（GKI 结构：kernel_workspace/common）
      - name: Custom Kernel Suffix if set
        if: ${{ github.event.inputs.KERNEL_NAME != '' && github.event.inputs.KERNEL_NAME != '-1' }}
        shell: bash
        env:
          SUFFIX: ${{ github.event.inputs.KERNEL_NAME }}
          CI_VERSION: ${{ github.event.inputs.ci_VERSION }}
        run: |
          cd kernel_workspace
          # 内核 Android 版本号：优先 build.config.*，回退 ci_VERSION 首段
          KANDROID_VERSION="${KANDROID_VERSION:-}"
          if [ -z "$KANDROID_VERSION" ]; then
            for c in ./common/build.config.constants ./common/build.config.common; do
              [ -f "$c" ] || continue
              BR=$(grep -m1 '^BRANCH=' "$c" | cut -d= -f2)
              [ -n "$BR" ] && KANDROID_VERSION="${BR%-*}" && break
            done
          fi
          KANDROID_VERSION="${KANDROID_VERSION:-${CI_VERSION%%-*}}"

          # 归一化：后缀自带前导 - 或自带 androidXX 段时视为完整 localversion，避免重复拼接
          case "$SUFFIX" in
            -*)                                        LOCALVER="$SUFFIX" ;;
            "$KANDROID_VERSION"|"$KANDROID_VERSION"-*) LOCALVER="-$SUFFIX" ;;
            *)                                         LOCALVER="-${KANDROID_VERSION}-${SUFFIX}" ;;
          esac
          # 转义 sed 替换串中的特殊字符（\ & |）
          LOCALVER_ESC=$(printf '%s' "$LOCALVER" | sed -e 's/[\\&|]/\\&/g')

          # 只改 common：决定 KERNELRELEASE 的只有这一个，external/dtc 只影响 dtc 工具版本
          for f in ./common/scripts/setlocalversion; do
            [ -f "$f" ] || continue
            echo "Modifying: $f"

            # 移除 -dirty
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"

            if grep -q 'KERNELVERSION.*scm_version' "$f"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}${LOCALVER_ESC}\"|" "$f"
            elif grep -q 'echo "\$res"' "$f"; then
              echo "Detected OLD setlocalversion format"
              sed -i "s|^res=.*|res=\"${LOCALVER_ESC}\"|" "$f"
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res${LOCALVER}\"" >> "$f"
            fi
            chmod +x "$f"
          done
          echo "内核后缀: ${LOCALVER}"

      # 伪官方格式的随机后缀（仅在 KERNEL_NAME 留空时生效）
      - name: Custom Kernel Random Suffix if empty
        if: ${{ github.event.inputs.KERNEL_NAME == '' }}
        shell: bash
        env:
          CI_VERSION: ${{ github.event.inputs.ci_VERSION }}
        run: |
          cd kernel_workspace
          KANDROID_VERSION="${KANDROID_VERSION:-}"
          if [ -z "$KANDROID_VERSION" ]; then
            for c in ./common/build.config.constants ./common/build.config.common; do
              [ -f "$c" ] || continue
              BR=$(grep -m1 '^BRANCH=' "$c" | cut -d= -f2)
              [ -n "$BR" ] && KANDROID_VERSION="${BR%-*}" && break
            done
          fi
          KANDROID_VERSION="${KANDROID_VERSION:-${CI_VERSION%%-*}}"

          # 生成随机数字和随机 hash
          RANDOM_DIGIT=$(od -An -N1 -tu1 < /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')
          RANDOM_HASH=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \n')
          RANDOM_SUFFIX="${RANDOM_DIGIT}-o-g${RANDOM_HASH}"

          for f in ./common/scripts/setlocalversion; do
            [ -f "$f" ] || continue
            echo "Modifying: $f"

            # 移除 -dirty
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"

            if grep -q 'KERNELVERSION.*scm_version' "$f"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"|" "$f"
            elif grep -q 'echo "\$res"' "$f"; then
              echo "Detected OLD setlocalversion format"
              sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"/" "$f"
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res-${RANDOM_SUFFIX}\"" >> "$f"
            fi
            chmod +x "$f"
          done
          echo "内核后缀(随机): -${KANDROID_VERSION}-${RANDOM_SUFFIX}"
            
      - name: Build kernel
        run: |
         cd kernel_workspace
         cd common
         rm -rf drivers/device_check/.git
         git add -A && git commit -a -m "BUILD Kernel"
         cd ..
         tools/bazel run --config=fast --config=stamp //common:kernel_aarch64_dist  -- --destdir=dist

      - name: Make AnyKernel3
        run: |
         set -euo pipefail
         OUTDIR="$GITHUB_WORKSPACE/kernel_workspace/out/android16-6.12/dist"
         if [ ! -f "$OUTDIR/Image" ]; then
           OUTDIR="$GITHUB_WORKSPACE/kernel_workspace/dist"
         fi
         if [ ! -f "$OUTDIR/Image" ]; then
           echo "未找到 Image: $OUTDIR/Image"
           exit 1
         fi

         # 打印最终内核版本，核对后缀与构建时间是否按预期生效
         strings "$OUTDIR/Image" | grep -m1 "Linux version" || echo "未能从 Image 提取版本串"

         KPM_ENABLE="${{ github.event.inputs.kpm_enable }}"
         if [ "$KPM_ENABLE" = "builtin" ]; then
           echo "正在应用内置 KPM 并修补内核: $OUTDIR/Image"
           cd "$OUTDIR"
           curl -LO "https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/latest/download/patch_linux"
           chmod +x patch_linux
           ./patch_linux
           rm -f Image
           mv oImage Image
         elif [ "$KPM_ENABLE" = "kpn" ]; then
           echo "正在应用 KP-N 并修补内核: $OUTDIR/Image"
           cd "$OUTDIR"
           wget "https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux"
           wget "https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux"
           chmod +x ./kptools-linux
           ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage
           rm -f Image
           mv oImage Image
         else
           echo "KPM 未启用，跳过内核修补"
         fi

         cd "$GITHUB_WORKSPACE"
         mkdir -p output
         cp "$OUTDIR/Image" ./output/
         git clone https://github.com/JiuGeFaCai/AnyKernel3.git --depth=1
         rm -rf ./AnyKernel3/.git
         cp ./output/Image ./AnyKernel3/
         if [ "$KPM_ENABLE" = "kpn" ]; then
           cd ./AnyKernel3
           wget "https://github.com/cctv18/KPatch-Next/releases/latest/download/kpn.zip"
         fi

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
         name: ${{ env.KSUVARIANT }}_${{ env.KSUVER }}_android16-(${{ env.TKERNEL_VERSION }})
         path: ./AnyKernel3/*
         
      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
         name: Image
         path: ./output/*

name: OnePlus SM850 Build SuKiSu SUSFS
on:
  workflow_dispatch:
    inputs:
      ci_VERSION:
        description: "谷歌ci版本"
        required: true
        default: 'android16-6.12-2025-06'
      enable_oneplus_common:
        description: "是否切换一加内核源码"
        required: false
        default: false
        type: boolean
      ksu_variant:
        description: "KernelSU 变体"
        type: choice
        options:
          - SukiSU
          - ReSukiSU
        default: ReSukiSU
      sukisu_version:
        description: "SukiSU/ReSukiSU 分支或提交"
        required: true
        default: "main"
      ksu_version_override:
        description: "锁定 KSU 版本号(留空=上游默认。SukiSU 默认会联网取上游 main 提交数，与所选 commit 无关，需要对齐管理器版本时在此填数字，如 40819)"
        required: false
        default: ""
      kpm_enable:
        description: '是否开启kpm(builtin-使用(re)sukisu内置kpm, kpn-使用独立kpm实现(支持任意KSU/面具环境); 不需要可保持默认关闭)'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'builtin'
          - 'kpn'
      KERNEL_NAME:
        type: string
        description: "自定义内核后缀 (留空使用随机伪官方后缀，输入-1关闭)"
        required: false
        default: ""
      BUILD_TIME:
        type: string
        description: "自定义构建时间 (输入F使用当前UTC时间，输入-1关闭)"
        required: false
        default: "Sun Jun 15 14:56:02 UTC 2025"
      RE_KERNEL:
        type: boolean
        description: "是否添加Re-Kernel？"
        required: true
        default: false
      enable_oneplus_patch:
        description: "是否启用一加补丁"
        required: false
        default: true
        type: boolean
      enable_Unicode_bypass_Fix:
        description: "零宽字符漏洞的修复补丁"
        required: false
        default: false
        type: boolean
      sukisu_tag:
        description: "自定义版本来源后缀"
        required: false
        default: "酷安-ITXUU-禁止黑灰违法犯罪倒卖"
      sus_enable:
        type: boolean
        description: "是否切换sus提交"
        required: true
        default: false
      sus_version:
        description: "sus分支"
        required: true
        default: "123456789"
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: Ensure 4 GiB swap
        shell: bash
        run: |
          set -euo pipefail
          SWAP_TARGET_MB=4096
          SWAP_CURRENT_MB=$(awk '/^SwapTotal:/ {print int($2 / 1024)}' /proc/meminfo)
          if [ "$SWAP_CURRENT_MB" -lt "$SWAP_TARGET_MB" ]; then
            SWAP_EXTRA_MB=$((SWAP_TARGET_MB - SWAP_CURRENT_MB))
            SWAP_FILE=/swapfile-kernel-build
            sudo install -m 600 /dev/null "$SWAP_FILE"
            sudo fallocate -l "${SWAP_EXTRA_MB}M" "$SWAP_FILE"
            sudo mkswap "$SWAP_FILE"
            sudo swapon "$SWAP_FILE"
          fi
          free -h
          swapon --show
          df -h / "$GITHUB_WORKSPACE"

      - name: Checkout repository
        uses: actions/checkout@v4
          
      - name: Configure Git
        run: |
         git config --global user.name "build"
         git config --global user.email "123456@qq.com"

      - name: Install dependencies
        run: |
         sudo apt-mark hold firefox
         sudo apt update
         sudo apt install -y curl ccache git python3 repo libelf-dev
        
      - name: Install repo tool
        run: |
         curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
         chmod a+x ~/repo
         sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize repo and sync
        run: |
         mkdir kernel_workspace && cd kernel_workspace
         FORMATTED_BRANCH="${{ github.event.inputs.ci_VERSION }}"
         repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} --repo-rev=v2.16
         REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
         DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
         if grep -q deprecated <<< $REMOTE_BRANCH; then
         echo "Found deprecated branch: ${FORMATTED_BRANCH}"
         sed -i 's/"'${FORMATTED_BRANCH}'"/"deprecated\/'${FORMATTED_BRANCH}'"/g' $DEFAULT_MANIFEST_PATH
         cat $DEFAULT_MANIFEST_PATH
         fi
         repo --version
         repo --trace sync -c -j$(nproc --all) --no-tags --fail-fast
         if [ "${{ github.event.inputs.enable_oneplus_common }}" = "true" ]; then
         if [ "${{ github.event.inputs.ci_VERSION }}" = "android16-6.12-2025-06" ]; then
         rm -rf common
         git clone https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8850.git --depth 1 common
         fi
         if [ "${{ github.event.inputs.ci_VERSION }}" = "android16-6.12-2025-09" ]; then
         rm -rf common
         git clone https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8845.git --depth 1 common
         fi
         if [ "${{ github.event.inputs.ci_VERSION }}" = "android16-6.12-2025-12" ]; then
         rm -rf common
         git clone https://github.com/OnePlusOSS/android_kernel_oneplus_mt6993.git --depth 1 common
         fi
         fi

      - name: Kernel Version Handling
        run: |
          cd kernel_workspace
          ORIG_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)
          echo "Kernel Version:$ORIG_VERSION"
          echo "TKERNEL_VERSION=$ORIG_VERSION" >> $GITHUB_ENV

         
      - name: Set up SukiSU
        env:
          KSU_VER_OVERRIDE_IN: ${{ github.event.inputs.ksu_version_override }}
        run: |
         cd kernel_workspace
         sed -i '/diff -u "${source_config}" ${OUT_DIR}\/defconfig >&2 || RES=$?/,/^[[:space:]]*fi$/d' build/kernel/_setup_env.sh
         KSU_VARIANT="${{ github.event.inputs.ksu_variant }}"
         KSU_REF="${{ github.event.inputs.sukisu_version }}"
         case "$KSU_VARIANT" in
           "SukiSU")
             echo "添加 SukiSU..."
             curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "$KSU_REF"
             ;;
           "ReSukiSU")
             echo "添加 ReSukiSU..."
             curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s "$KSU_REF"
             ;;
           *)
             echo "未知 KernelSU 变体: $KSU_VARIANT"
             exit 1
             ;;
         esac
         cd KernelSU
         # SukiSU 的 kernel/Kbuild 用 curl 现查上游 main 的提交数来算版本号
         # (GITHUB_COMMITS -> LOCAL_COUNT -> KSU_VERSION)，跟实际 checkout 的 commit 无关，
         # 即使 pin 了提交也会拿到上游最新的数字；ReSukiSU 数的是 HEAD，本身正常。
         # 管理器只在版本号完全相等时才不报"版本不一致"，需要对齐就用这个覆盖。
         KSU_VER_OVERRIDE="$(printf '%s' "${KSU_VER_OVERRIDE_IN:-}" | tr -d '[:space:]')"
         if [ -n "$KSU_VER_OVERRIDE" ]; then
           case "$KSU_VER_OVERRIDE" in
             *[!0-9]*) echo "❌ ksu_version_override 必须是纯数字，当前为: $KSU_VER_OVERRIDE"; exit 1 ;;
           esac
           PATCHED=0
           for VF in kernel/Kbuild kernel/Makefile; do
             [ -f "$VF" ] || continue
             # 只匹配 KSU_VERSION 自身的 := 赋值，不碰 KSU_VERSION_FULL / KSU_VERSION_API / KSU_LOCAL_VERSION
             if grep -qE '^[[:space:]]*KSU_VERSION[[:space:]]*:=' "$VF"; then
               sed -i -E "s|^([[:space:]]*)KSU_VERSION[[:space:]]*:=.*|\1KSU_VERSION := $KSU_VER_OVERRIDE|" "$VF"
               echo "✅ 已锁定 $VF 中的 KSU_VERSION := $KSU_VER_OVERRIDE"
               PATCHED=1
             fi
           done
           if [ "$PATCHED" = "0" ]; then
             echo "❌ 未在 kernel/Kbuild 或 kernel/Makefile 找到 KSU_VERSION := 赋值，上游结构可能已变更"
             exit 1
           fi
         fi
         if [ -n "$KSU_VER_OVERRIDE" ]; then
           KSU_VERSION="$KSU_VER_OVERRIDE"
         elif [ "$KSU_VARIANT" = "SukiSU" ]; then
           KSU_VERSION=$(expr $(git rev-list --count main) + 37185 2>/dev/null || echo 114514)
         else
           KSU_VERSION=$(expr $(git rev-list --count HEAD) + 30700 2>/dev/null || echo 114514)
         fi
         echo "KSUVER=${KSU_VERSION}" >> $GITHUB_ENV
         echo "KSUVARIANT=$KSU_VARIANT" >> $GITHUB_ENV
         export KSU_VERSION=$KSU_VERSION

      - name: Fix SukiSU 6.12 compatibility
        if: ${{ startsWith(github.event.inputs.ci_VERSION, 'android16-6.12') && (github.event.inputs.ksu_variant == 'SukiSU' || github.event.inputs.ksu_variant == 'ReSukiSU') }}
        run: |
         cd kernel_workspace
         python3 - <<'PY'
         from pathlib import Path

         changed = False
         ksu_dirs = [
             Path("common/drivers/kernelsu"),
             Path("drivers/kernelsu"),
             Path("KernelSU/kernel"),
         ]

         netlink_h = Path("common/include/linux/netlink.h")
         netlink_text = netlink_h.read_text(errors="ignore") if netlink_h.exists() else ""
         if netlink_h.exists() and "cb_mutex" not in netlink_text:
             for ksu_dir in ksu_dirs:
                 super_access_c = ksu_dir / "kpm/super_access.c"
                 if not super_access_c.exists():
                     continue
                 text = super_access_c.read_text()
                 line = "DEFINE_MEMBER(netlink_kernel_cfg, cb_mutex)\n"
                 if line in text:
                     super_access_c.write_text(text.replace(line, "", 1))
                     changed = True
                     print(f"Removed missing netlink_kernel_cfg.cb_mutex probe: {super_access_c}")

         lsm_hooks_h = Path("common/include/linux/lsm_hooks.h")
         lsm_hooks_text = lsm_hooks_h.read_text(errors="ignore") if lsm_hooks_h.exists() else ""
         if "const struct lsm_id *lsmid" in lsm_hooks_text:
             for ksu_dir in ksu_dirs:
                 lsm_hook_c = ksu_dir / "hook/lsm_hook.c"
                 if not lsm_hook_c.exists():
                     continue
                 text = lsm_hook_c.read_text()
                 old_call = '    security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksu");'
                 if old_call not in text or "ksu_lsmid" in text:
                     continue
                 anchor = "\nvoid __init ksu_lsm_hook_init(void)\n"
                 old_block = (
                     "#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 11, 0)\n"
                     f"{old_call}\n"
                     "#else"
                 )
                 new_block = (
                     "#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 12, 0)\n"
                     "    security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), &ksu_lsmid);\n"
                     "#elif LINUX_VERSION_CODE >= KERNEL_VERSION(4, 11, 0)\n"
                     f"{old_call}\n"
                     "#else"
                 )
                 lsmid_block = "\n".join([
                     "",
                     "/* Android 16 / 6.12 security_add_hooks() expects struct lsm_id. */",
                     "#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 12, 0)",
                     "static const struct lsm_id ksu_lsmid = {",
                     '    .name = "ksu",',
                     "    .id = 0,",
                     "};",
                     "#endif",
                     "",
                 ])
                 if anchor not in text or old_block not in text:
                     continue
                 text = text.replace(anchor, lsmid_block + anchor, 1)
                 text = text.replace(old_block, new_block, 1)
                 lsm_hook_c.write_text(text)
                 changed = True
                 print(f"Adapted security_add_hooks lsm_id argument: {lsm_hook_c}")

         if not changed:
             print("SukiSU 6.12 compatibility fix did not need changes.")
         PY
         
      - name: Set up susfs
        run: |
           cd kernel_workspace
           git clone -b oki-android16-6.12 https://github.com/cctv18/susfs4oki.git susfs4ksu
           if [ "${{ github.event.inputs.RE_KERNEL }}" = "true" ]; then
            git clone https://github.com/Sakion-Team/Re-Kernel.git
           fi

           if [ "${{ github.event.inputs.sus_enable }}" = "true" ]; then
              echo "正在切换到sus提交"
              cd susfs4ksu
              git checkout ${{ github.event.inputs.sus_version }}
              cd ..
            fi
           
           git clone https://github.com/ShirkNeko/SukiSU_patch.git
           cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch ./common/
           cp susfs4ksu/kernel_patches/fs/* ./common/fs/
           cp susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/

           # Apply patches
           cd ./common
           patch -p1 < 50_add_susfs_in_gki-android16-6.12.patch || true

           # patch 后面挂了 || true，被拒的 hunk 不会让这一步失败，
           # 只会在后面编译时才炸（比如 exec.c 少了 susfs_def.h），所以先把 .rej 打出来
           if find . -name '*.rej' | grep -q .; then
             echo "::warning::以下 hunk 被拒绝，需人工确认："
             find . -name '*.rej' -print -exec cat {} \;
           fi

      - name: Fix SUSFS exec.c header
        run: |
          cd kernel_workspace/common
          # exec.c 用到的 susfs 符号会随版本变（旧版 *_umounted，新版 *_no_su），
          # 所以按前缀统一判断，别写死单个函数名
          if grep -qE 'susfs_(is|set|clear)_current_proc' ./fs/exec.c && ! grep -qF '#include <linux/susfs_def.h>' ./fs/exec.c; then
            # uaccess.h 是 exec.c 里从 5.10 到 6.12 都稳定存在的锚点，
            # dma-buf.h / ksm.h 不一定有，sed 找不到锚点会静默什么都不做
            awk '/^#include <linux\/uaccess\.h>/ && !d { print "#ifdef CONFIG_KSU_SUSFS"; print "#include <linux/susfs_def.h>"; print "#endif"; d=1 } { print }' ./fs/exec.c > /tmp/exec.c
            mv /tmp/exec.c ./fs/exec.c
            grep -qF '#include <linux/susfs_def.h>' ./fs/exec.c || { echo "❌ exec.c 插入 susfs_def.h 失败，锚点已变"; exit 1; }
            echo "✅ 已修复 exec.c 缺少 susfs_def.h 问题"
          else
            echo "exec.c 无需修复或已包含 susfs_def.h"
          fi

      # - name: Fix SukiSU SUSFS compatibility
      #   if: ${{ github.event.inputs.ksu_variant == 'SukiSU' }}
      #   run: |
      #    set -euo pipefail
      #    python3 "$GITHUB_WORKSPACE/.github/scripts/fix_sukisu_susfs.py" "$GITHUB_WORKSPACE/kernel_workspace"
      
      # - name: Apply HOOK
      #   run: |
      #     cd kernel_workspace/common
      #     if [ "${{ github.event.inputs.HOOK }}" = "kprobe" ]; then
      #     echo "调用 kprobe 钩子"
      #     elif [ "${{ github.event.inputs.HOOK }}" = "manual" ]; then
      #     cp ../SukiSU_patch/hooks/scope_min_manual_hooks_v1.6.patch ./
      #     echo "调用 manual 钩子"
      #     patch -p1 -F 3 < scope_min_manual_hooks_v1.6.patch
      #     elif [ "${{ github.event.inputs.HOOK }}" = "tracepoint" ]; then
      #     cp ../SukiSU_patch/hooks/sukisu_tracepoint_hooks_v1.1.patch ./
      #     echo "调用 tracepoint 钩子"
      #     patch -p1 -F 3 < sukisu_tracepoint_hooks_v1.1.patch
      #     fi
      
      # Custom kernel build time, without adding #1 SMP PREEMPT 自定义内核构建时间，不要加入#1 SMP PREEMPT
      - name: Custom BUILD_TIME
        if: ${{ github.event.inputs.BUILD_TIME != '-1' }}
        shell: bash
        run: |
          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" && "$INPUT_TIME" != "f" ]]; then
            DATESTR="$INPUT_TIME"
            echo "Using input BUILD_TIME: $DATESTR"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
            echo "Using UTC time as fallback: $DATESTR"
          fi
          echo "KBUILD_BUILD_TIMESTAMP=${DATESTR}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          cd kernel_workspace/
          for f in common/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching mkcompile_h with BUILD_TIME=$DATESTR"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          done
          
      - name: oneplus
        if: ${{ inputs.enable_oneplus_patch }}
        run: |
         cd kernel_workspace
         git clone https://$TOKEN@github.com/JiuGeFaCai/sturdy-journey.git
         cp ./sturdy-journey/lsm.patch ./common/
         cd ./common
         patch -p1 -F 3 < lsm.patch

      # - name: sb
      #   if: ${{ inputs.enable_device_check }}
      #   run: |
      #    cd kernel_workspace/common/drivers
      #    git clone https://$TOKEN@github.com/JiuGeFaCai/device_check.git --depth 1
      #    TAG_DEVICE="${{ github.event.inputs.device_tag }}"
      #    sed -i "s/a2cbba3e/$TAG_DEVICE/g" device_check/serial_check.c
      #    echo "obj-y				+= device_check/" >> Makefile


      - name: Apply Unicode bypass Fix
        if: ${{inputs.enable_Unicode_bypass_Fix }}
        run: |
         cd kernel_workspace
         git clone https://$TOKEN@github.com/JiuGeFaCai/Unicode_bypass_Fix.git
         cp ./Unicode_bypass_Fix/unicode_bypass_fix_6.1+.patch ./common/
         cd ./common
         patch -p1 -F 3 < unicode_bypass_fix_6.1+.patch

      - name: Apply RE_KERNEL
        if: ${{ github.event.inputs.RE_KERNEL == 'true' }}
        run: |
          RE_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Re-Kernel/LKM-Source"
          cd kernel_workspace/common
          sed -i '/endmenu/i source "drivers/rekernel/Kconfig"' drivers/Kconfig
          sed -i '$a \#Re-Kernel Support\nobj-$(CONFIG_REKERNEL) += rekernel/' drivers/Makefile
          mkdir -p drivers/rekernel
          cp ${RE_DIR}/rekernel.c ${RE_DIR}/rekernel.h ${RE_DIR}/Makefile ${RE_DIR}/Kconfig drivers/rekernel/
          sed -i "s|^\s*//\s*#define KERNEL_${KERNEL_SHORT_PATCH_VERSION}|\#define KERNEL_${KERNEL_SHORT_PATCH_VERSION}|" drivers/rekernel/rekernel.h


      - name: Add SUSFS Configuration Settings
        run: |
          cd kernel_workspace
          CONFIG_FILE=./common/arch/arm64/configs/gki_defconfig
          # SukiSU Ultra配置
          echo "CONFIG_KSU=y" >> "$CONFIG_FILE"

          # KPM配置
          KPM_ENABLE="${{ github.event.inputs.kpm_enable }}"
          KSU_VARIANT="${{ github.event.inputs.ksu_variant }}"
          if [ "$KPM_ENABLE" = "builtin" ] && { [ "$KSU_VARIANT" = "SukiSU" ] || [ "$KSU_VARIANT" = "ReSukiSU" ]; }; then
            echo "CONFIG_KPM=y" >> "$CONFIG_FILE"
          fi

          # # HOOK配置
          # if [ "${{ github.event.inputs.HOOK }}" = "kprobe" ]; then
          #   echo "CONFIG_KSU_SUSFS_SUS_SU=y" >> "$CONFIG_FILE"
          #   echo "CONFIG_KPROBES=y" >> "$CONFIG_FILE"
          #   echo "CONFIG_KSU_KPROBES_HOOK=y" >> "$CONFIG_FILE"
          # elif [ "${{ github.event.inputs.HOOK }}" = "manual" ]; then
          #   echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> "$CONFIG_FILE"
          #   echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$CONFIG_FILE"
          # elif [ "${{ github.event.inputs.HOOK }}" = "tracepoint" ]; then
          #   echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> "$CONFIG_FILE"
          #   echo "CONFIG_KSU_TRACEPOINT_HOOK=y" >> "$CONFIG_FILE"
          # fi

          # SUSFS配置
          echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CONFIG_FILE"

          # Re-Kernel配置*
          if [ "${{ github.event.inputs.RE_KERNEL }}" = "true" ]; then
            echo "CONFIG_REKERNEL=y" >> "$CONFIG_FILE"
            echo "CONFIG_REKERNEL_NETWORK=y" >> "$CONFIG_FILE"
          fi
          
          # Remove check_defconfig
          sed -i 's/check_defconfig//' ./common/build.config.gki
          cd common
          if [ -f "BUILD.bazel" ]; then
          sed -i '/protected_module_names_list.*gki_aarch64_protected_module_names/d' BUILD.bazel
          fi

      # 自定义内核后缀（GKI 结构：kernel_workspace/common）
      - name: Custom Kernel Suffix if set
        if: ${{ github.event.inputs.KERNEL_NAME != '' && github.event.inputs.KERNEL_NAME != '-1' }}
        shell: bash
        env:
          SUFFIX: ${{ github.event.inputs.KERNEL_NAME }}
          CI_VERSION: ${{ github.event.inputs.ci_VERSION }}
        run: |
          cd kernel_workspace
          # 内核 Android 版本号：优先 build.config.*，回退 ci_VERSION 首段
          KANDROID_VERSION="${KANDROID_VERSION:-}"
          if [ -z "$KANDROID_VERSION" ]; then
            for c in ./common/build.config.constants ./common/build.config.common; do
              [ -f "$c" ] || continue
              BR=$(grep -m1 '^BRANCH=' "$c" | cut -d= -f2)
              [ -n "$BR" ] && KANDROID_VERSION="${BR%-*}" && break
            done
          fi
          KANDROID_VERSION="${KANDROID_VERSION:-${CI_VERSION%%-*}}"

          # 归一化：后缀自带前导 - 或自带 androidXX 段时视为完整 localversion，避免重复拼接
          case "$SUFFIX" in
            -*)                                        LOCALVER="$SUFFIX" ;;
            "$KANDROID_VERSION"|"$KANDROID_VERSION"-*) LOCALVER="-$SUFFIX" ;;
            *)                                         LOCALVER="-${KANDROID_VERSION}-${SUFFIX}" ;;
          esac
          # 转义 sed 替换串中的特殊字符（\ & |）
          LOCALVER_ESC=$(printf '%s' "$LOCALVER" | sed -e 's/[\\&|]/\\&/g')

          # 只改 common：决定 KERNELRELEASE 的只有这一个，external/dtc 只影响 dtc 工具版本
          for f in ./common/scripts/setlocalversion; do
            [ -f "$f" ] || continue
            echo "Modifying: $f"

            # 移除 -dirty
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"

            if grep -q 'KERNELVERSION.*scm_version' "$f"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}${LOCALVER_ESC}\"|" "$f"
            elif grep -q 'echo "\$res"' "$f"; then
              echo "Detected OLD setlocalversion format"
              sed -i "s|^res=.*|res=\"${LOCALVER_ESC}\"|" "$f"
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res${LOCALVER}\"" >> "$f"
            fi
            chmod +x "$f"
          done
          echo "内核后缀: ${LOCALVER}"

      # 伪官方格式的随机后缀（仅在 KERNEL_NAME 留空时生效）
      - name: Custom Kernel Random Suffix if empty
        if: ${{ github.event.inputs.KERNEL_NAME == '' }}
        shell: bash
        env:
          CI_VERSION: ${{ github.event.inputs.ci_VERSION }}
        run: |
          cd kernel_workspace
          KANDROID_VERSION="${KANDROID_VERSION:-}"
          if [ -z "$KANDROID_VERSION" ]; then
            for c in ./common/build.config.constants ./common/build.config.common; do
              [ -f "$c" ] || continue
              BR=$(grep -m1 '^BRANCH=' "$c" | cut -d= -f2)
              [ -n "$BR" ] && KANDROID_VERSION="${BR%-*}" && break
            done
          fi
          KANDROID_VERSION="${KANDROID_VERSION:-${CI_VERSION%%-*}}"

          # 生成随机数字和随机 hash
          RANDOM_DIGIT=$(od -An -N1 -tu1 < /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')
          RANDOM_HASH=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \n')
          RANDOM_SUFFIX="${RANDOM_DIGIT}-o-g${RANDOM_HASH}"

          for f in ./common/scripts/setlocalversion; do
            [ -f "$f" ] || continue
            echo "Modifying: $f"

            # 移除 -dirty
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"

            if grep -q 'KERNELVERSION.*scm_version' "$f"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"|" "$f"
            elif grep -q 'echo "\$res"' "$f"; then
              echo "Detected OLD setlocalversion format"
              sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"/" "$f"
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res-${RANDOM_SUFFIX}\"" >> "$f"
            fi
            chmod +x "$f"
          done
          echo "内核后缀(随机): -${KANDROID_VERSION}-${RANDOM_SUFFIX}"
            
      - name: Build kernel
        run: |
         cd kernel_workspace
         cd common
         rm -rf drivers/device_check/.git
         git add -A && git commit -a -m "BUILD Kernel"
         cd ..
         tools/bazel run --config=fast --config=stamp //common:kernel_aarch64_dist  -- --destdir=dist

      - name: Make AnyKernel3
        run: |
         set -euo pipefail
         OUTDIR="$GITHUB_WORKSPACE/kernel_workspace/out/android16-6.12/dist"
         if [ ! -f "$OUTDIR/Image" ]; then
           OUTDIR="$GITHUB_WORKSPACE/kernel_workspace/dist"
         fi
         if [ ! -f "$OUTDIR/Image" ]; then
           echo "未找到 Image: $OUTDIR/Image"
           exit 1
         fi

         # 打印最终内核版本，核对后缀与构建时间是否按预期生效
         strings "$OUTDIR/Image" | grep -m1 "Linux version" || echo "未能从 Image 提取版本串"

         KPM_ENABLE="${{ github.event.inputs.kpm_enable }}"
         if [ "$KPM_ENABLE" = "builtin" ]; then
           echo "正在应用内置 KPM 并修补内核: $OUTDIR/Image"
           cd "$OUTDIR"
           curl -LO "https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/latest/download/patch_linux"
           chmod +x patch_linux
           ./patch_linux
           rm -f Image
           mv oImage Image
         elif [ "$KPM_ENABLE" = "kpn" ]; then
           echo "正在应用 KP-N 并修补内核: $OUTDIR/Image"
           cd "$OUTDIR"
           wget "https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux"
           wget "https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux"
           chmod +x ./kptools-linux
           ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage
           rm -f Image
           mv oImage Image
         else
           echo "KPM 未启用，跳过内核修补"
         fi

         cd "$GITHUB_WORKSPACE"
         mkdir -p output
         cp "$OUTDIR/Image" ./output/
         git clone https://github.com/JiuGeFaCai/AnyKernel3.git --depth=1
         rm -rf ./AnyKernel3/.git
         cp ./output/Image ./AnyKernel3/
         if [ "$KPM_ENABLE" = "kpn" ]; then
           cd ./AnyKernel3
           wget "https://github.com/cctv18/KPatch-Next/releases/latest/download/kpn.zip"
         fi

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
         name: ${{ env.KSUVARIANT }}_${{ env.KSUVER }}_android16-(${{ env.TKERNEL_VERSION }})
         path: ./AnyKernel3/*
         
      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
         name: Image
         path: ./output/*
